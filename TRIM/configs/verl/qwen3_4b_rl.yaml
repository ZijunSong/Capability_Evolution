# TRIM FSDP2 CISPO contract for Qwen3-4B (maps to verl v0.9 CISPO clip [0, 5]).
# Launch: bash TRIM/scripts/run_qwen3_4b_rl_fsdp2_gpu8.sh
# The runtime path is TRIM FSDP2 + per-rank vLLM TP=1, not RayPPOTrainer.
actor_rollout_ref:
  actor:
    strategy: fsdp2
    policy_loss:
      loss_mode: cispo
    clip_ratio_low: 1.0
    clip_ratio_high: 4.0
    ppo_epochs: 1
    use_kl_loss: false
    entropy_coeff: 0
    optim:
      lr: 1.0e-5
    use_dynamic_bsz: true
  model:
    use_remove_padding: true
    lora_rank: 8
    lora_alpha: 16
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
  rollout:
    name: vllm
    n: 8
lambda_opd: 0.0
train_method: rl
