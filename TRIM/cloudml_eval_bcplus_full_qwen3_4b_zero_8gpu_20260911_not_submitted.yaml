# CloudML custom_train configuration for TRIM Harness-1 BC+ full Qwen3-4B "zero" eval.
# Prepared 2026-09-11; NOT SUBMITTED.
#
# What this job runs:
#   Only the "Qwen3-4B zero" slice of scripts/run_bcplus_full_gpu8_eval.sh (the
#   wrapper otherwise runs 6 groups: {gpt-oss-20b, harness-1, Qwen3-4B} x {zero, all}).
#   We `source` the wrapper so its verified vLLM start/stop + run_eval functions are
#   reused, but call ONLY start_zero_stack + run_eval(zero) for Qwen3-4B. The wrapper's
#   main() is guarded by [[ "${BASH_SOURCE[0]}" == "${0}" ]] and does NOT run under
#   source, so the all-branch (start_all_stack) is never entered. This matches the
#   gpt-oss-20b eval precedent (source + call only the requested slice).
#
#   zero topology (from the gpu8 wrapper, unchanged): 1 actor vLLM on GPU 7
#   (port 8040, served name Qwen3-4B-Instruct-2507, --tool-call-parser hermes),
#   and TP=64 data-parallel eval worker shards all hitting that single actor URL.
#   GPU 0-6 remain idle (the wrapper reserves them for the all-pass we are NOT running).
#   --tp is --eval-replicas (trim/cli/launch.py:835), i.e. shard count, NOT vLLM tensor
#   parallel; the single actor vLLM stays TP=1 on one card.
#
# Setting alignment (CLAUDE.md "## Capability Evolution / SCAPE 经验"):
#   Locked four-package runtime — Torch 2.10.0 / vLLM 0.19.1 / Transformers 4.57.6 /
#   Pyserini 2.0.0. Settings kept at the wrapper's native defaults (no unaligned
#   throughput overrides): TP=64, VLLM_MAX_NUM_SEQS=128, GPU_UTIL=0.70,
#   max_turns=40, max_new_tokens=2048, temperature=1.0, benchmark=bcplus_full.
#   --retrieval-backend local_bm25 --reranker none --offline (no Chroma server).
#
# No Chroma server dependency:
#   The wrapper exports HARNESS1_FORBID_CHROMA=1 (line 84) and passes
#   --retrieval-backend local_bm25 --reranker none --offline. The worker sets
#   HARNESS1_FORBID_CHROMA=1 again (harness1_api_worker.py), build_local_toolset
#   records chroma_initialized=False, and offline_credentials.py fills
#   CHROMA_API_KEY/CHROMA_DATABASE=local-offline. SCAPE_CHROMA_PATH=/tmp/empty_chroma
#   is kept only as belt-and-suspenders forcing chromadb.PersistentClient (embedded)
#   if the Chroma branch is ever hit. No CHROMA_HOST/PORT/URL or HttpClient exists.
#
# Import-chain deps (verified): the upstream_api worker calls load_upstream_modules()
# -> training.train_rl -> tinker_cookbook.rl.types (top-level `import chz` +
# `import tinker` + `from tinker_cookbook.completers import ...`) and harness.agent
# (top-level `import json_repair`). chz/tinker/json_repair are therefore HARD-required
# on the zero eval path. Installed with --no-deps (after the four-package lock) so
# tinker's unconstrained transformers metadata cannot upgrade transformers to 5.x.
#
# JuiceFS is intentionally OMITTED from this YAML. Submit with the direct CLI
# --juicefs_mount_configs argument so endpoint=bj9-cloudml is explicit in the API
# request (see submit_..._not_submitted.sh). Do NOT use the YAML --filename path
# for mounts.
jobName: "eval-bcplus-full-qwen3-4b-zero-8gpu-20260911"
description: "Harness-1 BC+ full Qwen3-4B 'zero' eval on 8x gm402-80g; 1 single-card actor vLLM (GPU 7) + TP=64 eval shards, local_bm25 retrieval (no Chroma server), offline tiktoken + Pyserini/JVM + load_upstream_modules preflight"
accessType: "PRIVATE"
tags:
  - "MemQA-General-V5"

imageConfig:
  imageUrl: "micr.cloud.mioffice.cn/songzijun/songzijun-cto:3050749-songzijun-cto"
  imageCommand: |-
    set -euxo pipefail
    export PYTHONUNBUFFERED=1
    export CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
    export MAX_TURNS=40
    export PY=python3
    export VLLM=vllm
    export VLLM_DISABLE_CUSTOM_ALL_REDUCE=1
    export OPENAI_API_KEY="${OPENAI_API_KEY:-*****-*******-***********}"
    export SCAPE_LOCAL_OPENAI_EMBEDDINGS=1
    export SCAPE_CHROMA_PATH=/tmp/empty_chroma
    mkdir -p "$SCAPE_CHROMA_PATH"
    # --- offline tiktoken: harness-1 / tinker import paths touch tiktoken; wire the
    #     offline bundle (cl100k_base + o200k_base) to forbid runtime downloads. ---
    python3 -c "import zipfile; zipfile.ZipFile('/mnt/songzijun/tiktoken-bundle.zip').extractall('/tmp')"
    test -f /tmp/tiktoken-bundle/share/tiktoken/o200k_base.tiktoken
    test -f /tmp/tiktoken-bundle/share/tiktoken/cl100k_base.tiktoken
    export TIKTOKEN_ENCODINGS_BASE=/tmp/tiktoken-bundle/share/tiktoken
    export TIKTOKEN_RS_CACHE_DIR=/tmp/tiktoken-bundle/tiktoken_rs_cache
    export TIKTOKEN_CACHE_DIR=/tmp/tiktoken-bundle/tiktoken_cache
    nvidia-smi -L
    test -f /mnt/songzijun/Capability_Evolution/TRIM/scripts/run_bcplus_full_gpu8_eval.sh
    test -f /mnt/songzijun/Capability_Evolution/TRIM/scripts/run_eval.py
    test -d /mnt/songzijun/models/Qwen3-4B-Instruct-2507
    test -d /mnt/songzijun/Capability_Evolution/SCOPE/external/BrowseComp-Plus/indexes/bm25
    test -f /mnt/songzijun/Capability_Evolution/SCOPE/external/BrowseComp-Plus/data/browsecomp_plus_corpus_full.jsonl
    test -d /mnt/songzijun/Capability_Evolution/SCAPE-EasyOPD
    test -f /mnt/songzijun/Capability_Evolution/TRIM/sitecustomize_dir/sitecustomize.py
    # --- JVM for Pyserini Lucene (probe first; do not trust a non-empty JAVA_HOME) ---
    JVM_PATH=$(find /usr /opt -type f -name libjvm.so 2>/dev/null | head -1 || true)
    if [ -z "${JVM_PATH}" ]; then
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-21-jre-headless
      JVM_PATH=$(find /usr /opt -type f -name libjvm.so 2>/dev/null | head -1 || true)
    fi
    test -n "${JVM_PATH}"
    test -f "${JVM_PATH}"
    ldd "${JVM_PATH}"
    export JVM_PATH
    export JAVA_HOME=$(dirname "$(dirname "$(dirname "${JVM_PATH}")")")
    export LD_LIBRARY_PATH=$(dirname "${JVM_PATH}"):${LD_LIBRARY_PATH:-}
    # --- locked four-package runtime (CLAUDE.md) + harness import-chain deps ---
    python3 -m pip install --no-cache-dir --ignore-installed --upgrade-strategy only-if-needed \
      "torch==2.10.0" "vllm==0.19.1" "transformers==4.57.6" "pyserini==2.0.0" \
      structlog chromadb tqdm sentence-transformers regex sympy latex2sympy2 word2number sentencepiece \
      openai tenacity anthropic requests pydantic
    # --- chz / tinker / json_repair + harness-1 pyproject deps, --no-deps so tinker's
    #     unconstrained transformers metadata cannot upgrade transformers to 5.x. ---
    python3 -m pip install --no-cache-dir --no-deps \
      json_repair langchain-text-splitters wikipedia-api fastembed baseten-performance-client \
      trl wandb modal pysqlite3-binary openai-harmony pydantic-settings
    python3 -m pip install --no-cache-dir --no-deps chz tinker
    # --- ANSERINI_CLASSPATH -> pyserini resources/jars (NOT the package root) ---
    PYSERINI_ROOT=$(python3 -c 'import pathlib, pyserini; print(pathlib.Path(pyserini.__file__).resolve().parent)')
    export ANSERINI_CLASSPATH=$(find "$PYSERINI_ROOT/resources/jars" -type f -name '*.jar' -print | paste -sd: -)
    test -n "$ANSERINI_CLASSPATH"
    export CLASSPATH="$ANSERINI_CLASSPATH"
    # --- preflight: four versions + 8 GPU + PyJNI + Lucene bcplus index opens +
    #     load_upstream_modules full import (catches any missing dep BEFORE the ~7min
    #     vLLM actor startup). ---
    python3 - <<'PY'
    import importlib.metadata
    import os
    import torch
    import transformers
    import vllm
    from jnius import autoclass
    autoclass("java.lang.String")
    versions = {
        "torch": torch.__version__,
        "vllm": vllm.__version__,
        "transformers": transformers.__version__,
        "pyserini": importlib.metadata.version("pyserini"),
        "structlog": importlib.metadata.version("structlog"),
        "chromadb": importlib.metadata.version("chromadb"),
        "chz": importlib.metadata.version("chz"),
        "tinker": importlib.metadata.version("tinker"),
        "json_repair": importlib.metadata.version("json_repair"),
        "gpu_count": torch.cuda.device_count(),
        "JVM_PATH": os.environ["JVM_PATH"],
        "JAVA_HOME": os.environ["JAVA_HOME"],
        "TIKTOKEN_ENCODINGS_BASE": os.environ.get("TIKTOKEN_ENCODINGS_BASE"),
        "o200k_base_present": os.path.isfile(
            os.path.join(os.environ["TIKTOKEN_ENCODINGS_BASE"], "o200k_base.tiktoken")
        ),
        "java_ok": True,
    }
    print("PREFLIGHT", versions, flush=True)
    assert versions["torch"].startswith("2.10.0")
    assert versions["vllm"] == "0.19.1"
    assert versions["transformers"] == "4.57.6"
    assert versions["pyserini"] == "2.0.0"
    assert versions["gpu_count"] == 8
    assert versions["o200k_base_present"]
    from pyserini.search.lucene import LuceneSearcher
    s = LuceneSearcher("/mnt/songzijun/Capability_Evolution/SCOPE/external/BrowseComp-Plus/indexes/bm25")
    n_docs = s.num_docs if not callable(s.num_docs) else s.num_docs()
    print("LUCENE_OK", {"num_docs": n_docs}, flush=True)
    assert n_docs > 0
    import sys
    for p in (
        "/mnt/songzijun/Capability_Evolution/TRIM/external/harness-1",
        "/mnt/songzijun/Capability_Evolution/TRIM/external/harness-1/tinker-cookbook",
        "/mnt/songzijun/Capability_Evolution/TRIM",
        "/mnt/songzijun/Capability_Evolution/SCAPE-EasyOPD",
    ):
        if p not in sys.path:
            sys.path.insert(0, p)
    os.environ.setdefault("HARNESS1_FORBID_CHROMA", "1")
    from trim.upstream_harness1.env_bridge import load_upstream_modules
    mods = load_upstream_modules()
    print("UPSTREAM_MODULES_OK", {"count": len(mods), "keys": sorted(mods.keys())[:6]}, flush=True)
    assert "SlidingWindowSearchEnv" in mods
    PY
    # --- Copy the gpu8 wrapper to /tmp before sourcing: the wrapper contains python
    #     heredocs, and sourcing a script on JuiceFS can hit "error reading input file"
    #     under JuiceFS IO jitter. Only the script body runs from a container-local
    #     copy; models/code/data/tiktoken still come from the JuiceFS mount. ---
    cp /mnt/songzijun/Capability_Evolution/TRIM/scripts/run_bcplus_full_gpu8_eval.sh /tmp/run_bcplus_full_gpu8_eval.sh
    chmod +x /tmp/run_bcplus_full_gpu8_eval.sh
    export RUN_ID="$(date +%Y%m%d_%H%M%S)_bcplus_full_qwen3_4b_zero_8gpu"
    export BENCHMARK="${BENCHMARK:-bcplus_full}"
    export GPU="${GPU:-7}"
    export TP="${TP:-64}"
    export ZERO_ACTOR_PORT="${ZERO_ACTOR_PORT:-8040}"
    export GPU_UTIL="${GPU_UTIL:-0.70}"
    export VLLM_MAX_NUM_SEQS="${VLLM_MAX_NUM_SEQS:-128}"
    export WORKER_STAGGER="${WORKER_STAGGER:-0}"
    source /tmp/run_bcplus_full_gpu8_eval.sh
    # Sourcing the /tmp copy makes BASH_SOURCE[0] = /tmp/run_bcplus_full_gpu8_eval.sh,
    # so the wrapper's SCRIPT_DIR=/tmp and TRIM_ROOT computed as "/" (wrong). Re-anchor
    # TRIM_ROOT to the real TRIM dir, cd there, and re-derive the REL_* / BCPLUS_* paths
    # the wrapper's functions rely on (REL_MODELS, REL_OUT, REL_LOGS, REL_BCPLUS,
    # REL_SCAPE_EASYOPD, BCPLUS_INDEX, BCPLUS_CORPUS, VERIFY_MODEL_PATH). mkdir the
    # REL_LOGS dir again (the wrapper mkdir'd it under the bogus "/" path already).
    export TRIM_ROOT="/mnt/songzijun/Capability_Evolution/TRIM"
    cd "${TRIM_ROOT}"
    REL_MODELS="../../models"
    REL_BCPLUS="../SCOPE/external/BrowseComp-Plus"
    REL_OUT="outputs"
    REL_LOGS="${REL_OUT}/logs/${RUN_ID}"
    REL_SCAPE_EASYOPD="../SCAPE-EasyOPD"
    BCPLUS_INDEX="${REL_BCPLUS}/indexes/bm25"
    BCPLUS_CORPUS="${REL_BCPLUS}/data/browsecomp_plus_corpus_full.jsonl"
    VERIFY_MODEL_PATH="${REL_MODELS}/harness-1"
    mkdir -p "${REL_LOGS}"
    MASTER_LOG="${REL_LOGS}/master.log"
    # The wrapper sets PYTHONPATH=".:${REL_SCAPE_EASYOPD}" (line 81), which DROPS the
    # sitecustomize_dir / harness-1 / tinker-cookbook entries from envConfigs. Worker
    # subprocesses inherit this PYTHONPATH (subprocess_env_for_mask -> dict(os.environ)),
    # so re-prepend the full set AFTER sourcing so sitecustomize auto-registers the
    # anserini fatjar on jnius_config before the JVM starts in each worker. harness-1 /
    # tinker-cookbook are also added in-process by ensure_harness1_on_path(), but having
    # them on PYTHONPATH is a belt-and-suspenders for the worker's import chain.
    export PYTHONPATH="${TRIM_ROOT}/sitecustomize_dir:${TRIM_ROOT}/external/harness-1:${TRIM_ROOT}/external/harness-1/tinker-cookbook:${TRIM_ROOT}:${TRIM_ROOT%/*}/SCAPE-EasyOPD:${PYTHONPATH}"
    ZERO_ACTOR_URL="http://127.0.0.1:${ZERO_ACTOR_PORT}/v1"
    log "RUN_ID=${RUN_ID} benchmark=${BENCHMARK} zero_gpu=${GPU} zero_tp=${TP} zero_port=${ZERO_ACTOR_PORT} gpu_util=${GPU_UTIL} vllm_max_num_seqs=${VLLM_MAX_NUM_SEQS} urls=${ZERO_ACTOR_URL}"
    ensure_full_corpus
    MODEL_PATH="${REL_MODELS}/Qwen3-4B-Instruct-2507"
    API_MODEL="Qwen3-4B-Instruct-2507"
    SLUG="Qwen3-4B-Instruct-2507"
    test -d "${MODEL_PATH}"
    # ONLY the Qwen3-4B zero slice: start the single actor + run component=zero eval.
    # main()'s all-branch (start_all_stack) is deliberately NOT entered.
    start_zero_stack "${MODEL_PATH}" "${API_MODEL}" "${SLUG}"
    run_eval "${MODEL_PATH}" "${SLUG}" "${API_MODEL}" "zero" \
      "${ZERO_ACTOR_URL}" "${TP}" "gpu${GPU}"
    stop_all_actors
    stop_verify
    log "finished qwen3-4b zero 8gpu; outputs under ${REL_OUT}/eval_h1_${BENCHMARK}_*_${RUN_ID}"

envConfigs:
  - key: "PYTHONUNBUFFERED"
    value: "1"
  - key: "CUDA_VISIBLE_DEVICES"
    value: "0,1,2,3,4,5,6,7"
  - key: "MAX_TURNS"
    value: "40"
  - key: "PYTHONPATH"
    value: "/mnt/songzijun/Capability_Evolution/TRIM/sitecustomize_dir:/mnt/songzijun/Capability_Evolution:/mnt/songzijun/Capability_Evolution/TRIM:/mnt/songzijun/Capability_Evolution/SCAPE-EasyOPD"
  - key: "VLLM_DISABLE_CUSTOM_ALL_REDUCE"
    value: "1"
  - key: "SCAPE_LOCAL_OPENAI_EMBEDDINGS"
    value: "1"
  - key: "SCAPE_CHROMA_PATH"
    value: "/tmp/empty_chroma"
  - key: "TIKTOKEN_ENCODINGS_BASE"
    value: "/tmp/tiktoken-bundle/share/tiktoken"
  - key: "TIKTOKEN_RS_CACHE_DIR"
    value: "/tmp/tiktoken-bundle/tiktoken_rs_cache"
  - key: "TIKTOKEN_CACHE_DIR"
    value: "/tmp/tiktoken-bundle/tiktoken_cache"

queueId: "2334"
priority: 8
preemptible: false
framework: "pytorch"
resourceConfigs:
  - nodeRole: "worker"
    nodeNumber: 1
    perNodeResourceSpec:
      resourcePriority: "GUARANTEED_PUBLIC"
      resourceName: "cloudml.ng1gm402-8-8.20-224"
      resourceNumber: 8
    elastic: false
    preemptible: false

enableTensorboard: false
enableMetrics: false
diagOptions:
  - name: "HangDetection"
    enable: false
retryConfig:
  enableRetry: false
  maxRetryTimes: 1
  policySets:
    - "JobFailed"
alertConfig:
  enableAlert: true
  alertItems:
    - alertConditions:
        - "FAILED"
      alertLevel: "P2"
      alertReceivers:
        persons:
          - "songzijun"
