# CloudML custom_train configuration for TRIM Harness-1 BC+ full Qwen3-4B-Instruct "all" eval.
# Prepared 2026-09-12; NOT SUBMITTED. tag=MemQA-General-V5, priority=8.
#
# WHY THIS RECOVERY
#   Prior Qwen3-4B all attempt t-20260911222900-owa0l (same 7 actor + 1 verify
#   topology, ALL_EVAL_TP=7) hung: rank2 worker stalled at qid=792 turn5
#   grep_corpus (23:22 Beijing) after a hermes JSONDecodeError on qid=744; the
#   worker had no per-query wall-clock limit so the format_retry death-loop
#   hung the whole shard forever. 6/7 shards were healthy (DONE.ok=true,
#   n_infra_error=0). The job was stopped at 06:04 with 734/830 queries and
#   NO root-level merge -> classified PARTIAL, not a formal artifact (CLAUDE.md:
#   failed/incomplete runs must not enter the formal summary). This job re-runs
#   the full 830 queries in a fresh output dir (no overwrite) and adds the
#   missing guard so a single hung query is skipped, not fatal.
#
# WHAT THIS JOB RUNS
#   Only the "qwen all" slice of scripts/run_bcplus_full_gpu8_eval.sh (the wrapper
#   otherwise runs 6 groups: {gpt-oss-20b, harness-1, Qwen3-4B-Instruct-2507} x {zero, all}).
#   We `source` the gpu8 wrapper so its verified vLLM start/stop functions are reused, but
#   call only start_all_stack + run_eval for Qwen3-4B-Instruct-2507 component=all with
#   SKIP_ZERO=1. main() is guarded by [[ "${BASH_SOURCE[0]}" == "${0}" ]] and does NOT run
#   under source, so sourcing the wrapper alone does not trigger the 6-group loop.
#
# PER-QUERY TIMEOUT GUARD (new vs 20260911 attempt)
#   trim/eval/harness1_api_worker.py:77,151 reads cfg["query_timeout_s"] and wraps each
#   query coroutine in asyncio.wait_for(..., timeout=query_timeout_s); on TimeoutError it
#   calls write_infra_error_query for that query and CONTINUES to the next query (shard
#   does not hang). run_eval.py builds worker_extra WITHOUT query_timeout_s (no CLI arg),
#   and _worker_config merges extra via cfg.update(dict(extra)) (harness1_api_launch.py:75).
#   We inject it via a dedicated sitecustomize: sitecustomize_qwen_all_recovery_20260912/
#   sitecustomize.py, whose directory is placed FIRST on PYTHONPATH (ahead of
#   sitecustomize_dir/). It monkeypatches _worker_config to setdefault
#   query_timeout_s=QUERY_TIMEOUT_S (default 600s = 10 min, per user 2026-09-12). The same
#   file also performs the anserini fatjar jnius registration that sitecustomize_dir does,
#   because Python imports only the first sitecustomize module on PYTHONPATH.
#   QUERY_TIMEOUT_S=0 disables the guard (not used here).
#
# 8-card topology (qwen all, re-balanced from the wrapper default since SKIP_ZERO=1):
#   7 single-card actor vLLM (GPU 0-6, ports 8040..8052) + 1 verify vLLM (GPU 7, port 8060),
#   ALL_TP=7, ALL_EVAL_TP=7. --tp is --eval-replicas (launch.py data-parallel shard count),
#   each shard maps to one actor URL via identity_for_actor_rank (rank % len(urls)).
#   tensor_parallel_size per vLLM stays 1 (single-card actors + single-card verifier).
#   Qwen3-4B-Instruct (dense 4B) fits on one gm402-80g card at max_model_len=32768.
#
# NO Chroma server dependency:
#   --retrieval-backend local_bm25 --reranker none --offline. The worker sets
#   HARNESS1_FORBID_CHROMA=1 (harness1_api_worker.py:57), build_local_toolset records
#   chroma_initialized=False, offline_credentials.py fills CHROMA_API_KEY/CHROMA_DATABASE
#   =local-offline. SCAPE_CHROMA_PATH=/tmp/empty_chroma forces chromadb.PersistentClient
#   (embedded, on-disk) if the Chroma branch is ever hit. No CHROMA_HOST/PORT/URL or
#   HttpClient exists anywhere in the codebase.
#
# TOKENIZER NOTE
#   Qwen3-4B-Instruct-2507 uses its own HF tokenizer.json (Qwen3ForCausalLM, tool-call-parser
#   hermes) and does NOT consume the tiktoken/o200k vocab. The harness-1 *verifier* model is a
#   gpt-oss derivative and uses the real openai_harmony encoder, so the offline tiktoken bundle
#   (o200k_base) is still extracted and wired for the verifier. There is NO separate
#   o200k_harmony.tiktoken — openai_harmony loads o200k_base.tiktoken + Harmony special tokens
#   (see tiktoken-bundle README).
#
# LOCKED FOUR-PACKAGE RUNTIME (CLAUDE.md): Torch 2.10.0 / Transformers 4.57.6 /
# vLLM 0.19.1 / Pyserini 2.0.0. Import-chain deps (structlog/chromadb/chz/tinker/json_repair)
# from prior gpt-oss eval recovery experience.
#
# JUICEFS is intentionally OMITTED from this YAML. Submit with the direct CLI
# --juicefs_mount_configs argument so endpoint=bj9-cloudml is explicit in the API request
# (see submit script). Do NOT use the YAML --filename path for mounts.
jobName: "eval-bcplus-full-qwen3-4b-all-8gpu-20260912-memqa-general-v5-r1"
description: "Qwen3-4B all recovery1: prior t-20260912190343-cmomc stopped at shard fork when the query_timeout monkeypatch was inactive (wrapper overwrote PYTHONPATH, dropping the sitecustomize that injects it). Fixed: re-export PYTHONPATH after sourcing wrapper so the patch is live in run_eval.py. Re-run full 830 fresh out dir. 7 actor GPU0-6+1 verify GPU7 ALL_TP=7, local_bm25 no Chroma, per-query timeout 600s. Locked Torch2.10.0/vLLM0.19.1/TF4.57.6/Pyserini2.0.0+chz/tinker/json_repair."
accessType: "PRIVATE"
tags:
  - "MemQA-General-V5"

imageConfig:
  imageUrl: "micr.cloud.mioffice.cn/songzijun/songzijun-cto:3050749-songzijun-cto"
  imageCommand: |-
    set -euxo pipefail
    export PYTHONUNBUFFERED=1
    export CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
    export MAX_TURNS=40
    export PY=python3
    export VLLM=vllm
    export VLLM_DISABLE_CUSTOM_ALL_REDUCE=1
    export OPENAI_API_KEY="${OPENAI_API_KEY:-*****-*******-***********}"
    export SCAPE_LOCAL_OPENAI_EMBEDDINGS=1
    export SCAPE_CHROMA_PATH=/tmp/empty_chroma
    mkdir -p "$SCAPE_CHROMA_PATH"

    # --- per-query wall-clock guard: a hung query is skipped, not fatal ---
    # Loaded as the first sitecustomize on PYTHONPATH (see envConfigs PYTHONPATH below).
    # Default 600s; QUERY_TIMEOUT_S overrides; =0 disables.
    export QUERY_TIMEOUT_S=600

    # --- offline tiktoken: harness-1 verifier (gpt-oss derivative) needs o200k_base ---
    # Qwen3-4B itself uses its HF tokenizer.json and does not consume this; kept for the verifier.
    python3 -c "import zipfile; zipfile.ZipFile('/mnt/songzijun/tiktoken-bundle.zip').extractall('/tmp')"
    test -f /tmp/tiktoken-bundle/share/tiktoken/o200k_base.tiktoken
    test -f /tmp/tiktoken-bundle/share/tiktoken/cl100k_base.tiktoken
    export TIKTOKEN_ENCODINGS_BASE=/tmp/tiktoken-bundle/share/tiktoken
    export TIKTOKEN_RS_CACHE_DIR=/tmp/tiktoken-bundle/tiktoken_rs_cache
    export TIKTOKEN_CACHE_DIR=/tmp/tiktoken-bundle/tiktoken_cache

    nvidia-smi -L
    test -f /mnt/songzijun/Capability_Evolution/TRIM/scripts/run_bcplus_full_gpu8_eval.sh
    test -f /mnt/songzijun/Capability_Evolution/TRIM/scripts/run_eval.py
    test -f /mnt/songzijun/Capability_Evolution/TRIM/sitecustomize_qwen_all_recovery_20260912/sitecustomize.py
    test -d /mnt/songzijun/models/Qwen3-4B-Instruct-2507
    test -d /mnt/songzijun/models/harness-1
    test -d /mnt/songzijun/Capability_Evolution/SCOPE/external/BrowseComp-Plus/indexes/bm25
    test -f /mnt/songzijun/Capability_Evolution/SCOPE/external/BrowseComp-Plus/data/browsecomp_plus_corpus_full.jsonl

    # --- JVM for Pyserini Lucene (probe first; do not trust a non-empty JAVA_HOME) ---
    JVM_PATH=$(find /usr /opt -type f -name libjvm.so 2>/dev/null | head -1 || true)
    if [ -z "${JVM_PATH}" ]; then
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-21-jre-headless
      JVM_PATH=$(find /usr /opt -type f -name libjvm.so 2>/dev/null | head -1 || true)
    fi
    test -n "${JVM_PATH}"
    test -f "${JVM_PATH}"
    ldd "${JVM_PATH}"
    export JVM_PATH
    export JAVA_HOME=$(dirname "$(dirname "$(dirname "${JVM_PATH}")")")
    export LD_LIBRARY_PATH=$(dirname "${JVM_PATH}"):${LD_LIBRARY_PATH:-}

    # --- locked four-package runtime + harness import-chain deps ---
    # chz + tinker: load_upstream_modules() -> training.train_rl -> tinker_cookbook.rl.types
    #   imports chz+tinker at module load.
    # json_repair: harness/agent.py:6 `import json_repair`.
    # structlog/chromadb: harness.ultra_core/harness.tools import chain.
    # datasets / pydantic-settings pulled in transitively by vllm.
    # --ignore-installed because base image distutils `blinker 1.4` blocks pip uninstall
    # (internal Xiaomi PyPI); --no-deps NOT used here so the four-package versions win.
    python3 -m pip install --no-cache-dir --ignore-installed --upgrade-strategy only-if-needed \
      "torch==2.10.0" "vllm==0.19.1" "transformers==4.57.6" "pyserini==2.0.0" \
      structlog chromadb chz tinker json_repair tqdm sentence-transformers regex sympy latex2sympy2 word2number sentencepiece openai tenacity

    # --- ANSERINI_CLASSPATH -> pyserini resources/jars (NOT the package root) ---
    PYSERINI_ROOT=$(python3 -c 'import pathlib, pyserini; print(pathlib.Path(pyserini.__file__).resolve().parent)')
    export ANSERINI_CLASSPATH=$(find "$PYSERINI_ROOT/resources/jars" -type f -name '*.jar' -print | paste -sd: -)
    test -n "$ANSERINI_CLASSPATH"
    export CLASSPATH="$ANSERINI_CLASSPATH"

    # --- preflight: four versions + 8 GPU + PyJNI + Lucene bcplus index opens + query_timeout patch ---
    # NOTE: sitecustomize already monkeypatched _worker_config at interpreter startup; the
    # assertion below confirms the patch is live (worker cfg will carry query_timeout_s=600).
    python3 - <<'PY'
    import importlib.metadata
    import os
    import torch
    import transformers
    import vllm
    import chz
    import tinker
    import json_repair
    from jnius import autoclass
    autoclass("java.lang.String")
    import trim.eval.harness1_api_launch as H
    versions = {
        "torch": torch.__version__,
        "vllm": vllm.__version__,
        "transformers": transformers.__version__,
        "pyserini": importlib.metadata.version("pyserini"),
        "structlog": importlib.metadata.version("structlog"),
        "chromadb": importlib.metadata.version("chromadb"),
        "chz": importlib.metadata.version("chz"),
        "tinker": importlib.metadata.version("tinker"),
        "json_repair": importlib.metadata.version("json_repair"),
        "gpu_count": torch.cuda.device_count(),
        "JVM_PATH": os.environ["JVM_PATH"],
        "JAVA_HOME": os.environ["JAVA_HOME"],
        "TIKTOKEN_ENCODINGS_BASE": os.environ.get("TIKTOKEN_ENCODINGS_BASE"),
        "o200k_base_present": os.path.isfile(
            os.path.join(os.environ["TIKTOKEN_ENCODINGS_BASE"], "o200k_base.tiktoken")
        ),
        "QUERY_TIMEOUT_S": os.environ.get("QUERY_TIMEOUT_S"),
        "query_timeout_patch_live": getattr(H, "_qwen_all_recovery_timeout_patched", False),
        "worker_config_wrapped": H._worker_config.__name__ if hasattr(H._worker_config, "__name__") else "n/a",
        "java_ok": True,
    }
    print("PREFLIGHT", versions, flush=True)
    assert versions["torch"].startswith("2.10.0")
    assert versions["vllm"] == "0.19.1"
    assert versions["transformers"] == "4.57.6"
    assert versions["pyserini"] == "2.0.0"
    assert versions["chz"] == "0.4.0"
    assert versions["tinker"] == "0.28.1"
    assert versions["json_repair"]
    assert versions["gpu_count"] == 8
    assert versions["o200k_base_present"]
    assert versions["query_timeout_patch_live"], "sitecustomize query_timeout patch did NOT load"
    assert H._worker_config.__name__ == "_patched_worker_config"
    from pyserini.search.lucene import LuceneSearcher
    s = LuceneSearcher("/mnt/songzijun/Capability_Evolution/SCOPE/external/BrowseComp-Plus/indexes/bm25")
    n_docs = s.num_docs if not callable(s.num_docs) else s.num_docs()
    print("LUCENE_OK", {"num_docs": n_docs}, flush=True)
    assert n_docs > 0
    PY

    # --- 8-GPU Qwen3-4B "all" topology: 7 actor vLLM (GPU 0-6) + 1 verify vLLM (GPU 7) ---
    # Source the gpu8 wrapper: its functions (start_all_stack/run_eval/cleanup/
    # start_vllm_bg/wait_api/verify_api_model) become available; main() is guarded and
    # does NOT run. The wrapper cd's into TRIM_ROOT and resolves REL_* paths from there.
    export RUN_ID="$(date +%Y%m%d_%H%M%S)_bcplus_full_qwen3_4b_all_8gpu"
    export SKIP_ZERO=1
    export MODELS=Qwen3-4B-Instruct-2507
    export ALL_ACTOR_GPUS=0,1,2,3,4,5,6
    export ALL_VERIFY_GPU=7
    # 7 actor vLLMs on GPUs 0-6, unique even ports 8040..8052 (no overlap with verifier).
    # The gpu8 wrapper default reserves 8050 for a 6-actor verify on GPU6; since we run 7
    # actors + 1 verify we move the verifier to 8060 to keep all ports disjoint.
    export ALL_ACTOR_PORTS=8040,8042,8044,8046,8048,8050,8052
    export ALL_VERIFY_PORT=8060
    export ALL_TP=7
    export ALL_EVAL_TP=7
    export GPU_UTIL=0.90
    export WORKER_STAGGER=5
    source /mnt/songzijun/Capability_Evolution/TRIM/scripts/run_bcplus_full_gpu8_eval.sh

    # CRITICAL: the wrapper just ran `export PYTHONPATH=".:${REL_SCAPE_EASYOPD}"`
    # (run_bcplus_full_gpu8_eval.sh:78), which OVERWROTE the envConfigs PYTHONPATH that
    # carried sitecustomize_qwen_all_recovery_20260912/ (first) and sitecustomize_dir/.
    # Without this restore, `python3 scripts/run_eval.py` (launched below by run_eval)
    # would NOT load our sitecustomize, so the query_timeout_s monkeypatch on
    # _worker_config would be absent -> worker config gets query_timeout_s=None -> a
    # single hung query (hermes format_retry death-loop, the t-20260911222900-owa0l
    # rank2 qid=792 failure mode) hangs the whole shard forever. Re-put the recovery
    # sitecustomize dir FIRST so its sitecustomize.py wins (Python imports only the
    # first one); keep the wrapper's `.` and SCAPE-EasyOPD for normal module resolution.
    export PYTHONPATH="/mnt/songzijun/Capability_Evolution/TRIM/sitecustomize_qwen_all_recovery_20260912:/mnt/songzijun/Capability_Evolution/TRIM/sitecustomize_dir:/mnt/songzijun/Capability_Evolution:/mnt/songzijun/Capability_Evolution/TRIM:/mnt/songzijun/Capability_Evolution/SCAPE-EasyOPD:.:${REL_SCAPE_EASYOPD}"
    # Sanity: the patched _worker_config must be live in a run_eval.py-equivalent process.
    python3 -c "import trim.eval.harness1_api_launch as H; assert getattr(H,'_qwen_all_recovery_timeout_patched',False), 'query_timeout patch NOT live after wrapper source'; assert H._worker_config.__name__=='_patched_worker_config'; print('PATCH_LIVE_POST_SOURCE', H._worker_config.__name__, 'query_timeout_s default=600')"

    # Override the wrapper's vllm_extra_for_model to raise per-server concurrency. The
    # upstream_api eval path does NOT consume --max-num-seqs at the runner level (only read
    # in the legacy_local branch), so the effective lever is the vLLM server itself: a larger
    # --max-num-seqs lets each single-card actor vLLM keep more multi-turn/retry/verify
    # requests in flight concurrently. Qwen3-4B uses --tool-call-parser hermes (already in
    # the wrapper's vllm_extra_for_model case). --enforce-eager still applied by start_vllm_bg
    # (gm402 has no flash-attn -> SDPA + eager, per CLAUDE.md).
    # NOTE: start_vllm_bg hardcodes --max-num-seqs "${VLLM_MAX_NUM_SEQS}" (default 128) AFTER
    # the per-model extra, and vLLM argparse takes the LAST value, so the 256 below is
    # overridden to 128. This is non-blocking (gpt-oss verify ran stably at 128 for 5.5h);
    # kept for intent and in case the hardcode is removed later.
    vllm_extra_for_model() {
      local slug="$1"
      case "${slug}" in
        Qwen3-4B-Instruct-2507)
          echo "--enable-auto-tool-choice --tool-call-parser hermes --max-model-len 32768 --trust-remote-code --max-num-seqs 256"
          ;;
        gpt-oss-20b|harness-1)
          echo "--enable-auto-tool-choice --tool-call-parser openai --max-model-len 32768 --trust-remote-code --moe-backend triton --max-num-seqs 128"
          ;;
        *)
          echo "--enable-auto-tool-choice --tool-call-parser openai --max-model-len 32768 --max-num-seqs 256"
          ;;
      esac
    }
    # The verifier (harness-1) is spawned by start_all_stack with a hardcoded extra string;
    # patch start_all_stack to use the unique ALL_VERIFY_PORT (8060). Keep its
    # --max-model-len 8192 --moe-backend triton. (No hardcode --max-num-seqs to fight here.)
    _orig_start_all_stack=start_all_stack
    start_all_stack() {
      local model_path="$1" api_model="$2" model_slug="$3"
      stop_all_actors
      stop_verify
      local actor_gpus=() actor_ports=()
      csv_to_array "${ALL_ACTOR_GPUS}" actor_gpus
      csv_to_array "${ALL_ACTOR_PORTS}" actor_ports
      if ((${#actor_gpus[@]} != ALL_TP)); then
        log "ALL_ACTOR_GPUS count (${#actor_gpus[@]}) must match ALL_TP (${ALL_TP})"
        exit 1
      fi
      if ((${#actor_ports[@]} != ALL_TP)); then
        log "ALL_ACTOR_PORTS count (${#actor_ports[@]}) must match ALL_TP (${ALL_TP})"
        exit 1
      fi
      local extra
      extra="$(vllm_extra_for_model "${model_slug}")"
      ACTOR_PIDS=()
      local i gpu port pid
      for i in "${!actor_gpus[@]}"; do
        gpu="${actor_gpus[$i]}"
        port="${actor_ports[$i]}"
        pid="$(start_vllm_bg "${gpu}" "${port}" "${model_path}" "${api_model}" \
          "${extra}" "${REL_LOGS}/actor_${model_slug}_all_gpu${gpu}.log")"
        pid="$(normalize_pid "${pid}")"
        ACTOR_PIDS+=("${pid}")
      done
      VERIFY_PID="$(start_vllm_bg "${ALL_VERIFY_GPU}" "${ALL_VERIFY_PORT}" "${VERIFY_MODEL_PATH}" \
        "${VERIFY_MODEL_NAME}" "--max-model-len 8192 --trust-remote-code --moe-backend triton" \
        "${REL_LOGS}/verify_${model_slug}.log")"
      VERIFY_PID="$(normalize_pid "${VERIFY_PID}")"
    }

    # Build the 7 comma-joined actor URLs the way main() does (run_eval --api-base-url).
    csv_to_array "${ALL_ACTOR_PORTS}" _ALL_PORTS_CHECK
    ALL_ACTOR_URLS="$(join_urls "${_ALL_PORTS_CHECK[@]}")"
    log "RUN_ID=${RUN_ID} skip_zero=${SKIP_ZERO} models=${MODELS} actors=${ALL_ACTOR_GPUS} verify=gpu${ALL_VERIFY_GPU}:${ALL_VERIFY_PORT} tp=${ALL_TP} eval_tp=${ALL_EVAL_TP} gpu_util=${GPU_UTIL} stagger=${WORKER_STAGGER} query_timeout_s=${QUERY_TIMEOUT_S} urls=${ALL_ACTOR_URLS}"

    ensure_full_corpus

    MODEL_PATH="${REL_MODELS}/Qwen3-4B-Instruct-2507"
    API_MODEL="Qwen3-4B-Instruct-2507"
    SLUG="Qwen3-4B-Instruct-2507"
    test -d "${MODEL_PATH}"

    start_all_stack "${MODEL_PATH}" "${API_MODEL}" "${SLUG}"
    run_eval "${MODEL_PATH}" "${SLUG}" "${API_MODEL}" "all" \
      "${ALL_ACTOR_URLS}" "${ALL_EVAL_TP}" "gpu${ALL_ACTOR_GPUS//,/}v${ALL_VERIFY_GPU}"

    stop_all_actors
    stop_verify
    log "finished qwen3-4b all 8gpu (recovery of t-20260911222900-owa0l); outputs under ${REL_OUT}/eval_h1_bcplus_full_*_${RUN_ID}"

envConfigs:
  - key: "PYTHONUNBUFFERED"
    value: "1"
  - key: "CUDA_VISIBLE_DEVICES"
    value: "0,1,2,3,4,5,6,7"
  - key: "MAX_TURNS"
    value: "40"
  # recovery sitecustomize dir FIRST so its sitecustomize.py wins (Python imports only the
  # first one); it carries both the query_timeout monkeypatch AND the jnius anserini
  # classpath registration (which sitecustomize_dir/ would otherwise provide).
  - key: "PYTHONPATH"
    value: "/mnt/songzijun/Capability_Evolution/TRIM/sitecustomize_qwen_all_recovery_20260912:/mnt/songzijun/Capability_Evolution/TRIM/sitecustomize_dir:/mnt/songzijun/Capability_Evolution:/mnt/songzijun/Capability_Evolution/TRIM:/mnt/songzijun/Capability_Evolution/SCAPE-EasyOPD"
  - key: "VLLM_DISABLE_CUSTOM_ALL_REDUCE"
    value: "1"
  - key: "SCAPE_LOCAL_OPENAI_EMBEDDINGS"
    value: "1"
  - key: "SCAPE_CHROMA_PATH"
    value: "/tmp/empty_chroma"
  - key: "TIKTOKEN_ENCODINGS_BASE"
    value: "/tmp/tiktoken-bundle/share/tiktoken"
  - key: "TIKTOKEN_RS_CACHE_DIR"
    value: "/tmp/tiktoken-bundle/tiktoken_rs_cache"
  - key: "TIKTOKEN_CACHE_DIR"
    value: "/tmp/tiktoken-bundle/tiktoken_cache"
  - key: "QUERY_TIMEOUT_S"
    value: "600"

queueId: "2334"
priority: 8
preemptible: false
framework: "pytorch"
resourceConfigs:
  - nodeRole: "worker"
    nodeNumber: 1
    perNodeResourceSpec:
      resourcePriority: "GUARANTEED_PUBLIC"
      resourceName: "cloudml.ng1gm402-8-8.20-224"
      resourceNumber: 8
    elastic: false
    preemptible: false

enableTensorboard: false
enableMetrics: false
diagOptions:
  - name: "HangDetection"
    enable: false
retryConfig:
  enableRetry: false
  maxRetryTimes: 1
  policySets:
    - "JobFailed"
alertConfig:
  enableAlert: true
  alertItems:
    - alertConditions:
        - "FAILED"
      alertLevel: "P2"
      alertReceivers:
        persons:
          - "songzijun"
