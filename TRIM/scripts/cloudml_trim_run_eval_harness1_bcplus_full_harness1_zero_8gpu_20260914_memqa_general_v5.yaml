# CloudML custom_train YAML
# TRIM Harness-1 BC+ full / harness-1 / ZERO eval / 单节点 8x gm402-80g
# 提交日期 2026-09-14，标签 MemQA-General-V5，priority 8。
#
# 被测模型 = /mnt/songzijun/models/pat-jj_harness-1-full/harness-1
#   (GptOssForCausalLM / gpt_oss / 32 experts 4 active / 24 层 / vocab 201088 / bf16 / harmony)
#   与 gpt-oss-20b 同架构同体积，故 vLLM 参数（openai parser + triton moe）与 tiktoken
#   o200k harmony 离线词表路径完全复用 gpt-oss-20b 已验证 runtime。
#
# 重要：JuiceFS 挂载不在本 YAML 中配置——按要求通过直接 CLI 参数
