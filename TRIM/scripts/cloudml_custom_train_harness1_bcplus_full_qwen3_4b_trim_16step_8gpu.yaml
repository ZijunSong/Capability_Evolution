# CloudML custom_train: TRIM Harness-1 BC+ full / Qwen3-4B-Instruct-2507 / trim / 8x gm402-80g
# 单节点 8 卡 PyTorch 训练任务，充分利用 8 卡显存（gpu_memory_utilization=0.90）。
#
# 重要：JuiceFS endpoint 不通过本 YAML（--filename）方式提交。
# 实际提交使用直接 CLI 参数，并通过 --juicefs_mount_configs 显式传入 JSON，
# 其中 endpoint（juiceFsCluster）必须为 "bj9-cloudml"。
# 本文件仅为可读底稿 / 审计快照；其 JuiceFSMountConfigs 不作为提交依据。
#
# 启动逻辑见 TRIM/scripts/run_train_cloudml_qwen3_4b_trim_16step_8gpu.sh
# （deps四包 + preflight + JVM + tiktoken + SCAPE env + exec run_train.py）。
# ImageCommand 先把 JuiceFS 上的脚本 cp 到 /tmp 再 exec，规避 heredoc 回读 JuiceFS 抖动（CLAUDE.md 经验）。
JobName: "trim_harness1_bcplus_full_qwen3_4b_trim_16step_8gpu_20260914"
Description: "TRIM Harness-1 BC+ full / Qwen3-4B-Instruct-2507 (bf16) / trim, 8x gm402-80g, gpu_mem_util=0.90, 16step/32grp/grp8, max-turns40 CLI, max-model-len8192, local_legacy SEC. Launch: TRIM/scripts/run_train_cloudml_qwen3_4b_trim_16step_8gpu.sh"
AccessType: "PRIVATE"
Tags:
  - "MemQA-General-V5"
ImageConfig:
  ImageUrl: "micr.cloud.mioffice.cn/songzijun/songzijun-cto:3050749-songzijun-cto"
  ImageCommand: "bash -lc 'cp /mnt/songzijun/Capability_Evolution/TRIM/scripts/run_train_cloudml_qwen3_4b_trim_16step_8gpu.sh /tmp/run_train_qwen3_4b_trim_16step.sh && bash /tmp/run_train_qwen3_4b_trim_16step.sh'"
QueueId: "2334"
Priority: 8
Framework: "pytorch"
ResourceConfigs:
  - NodeRole: "worker"
    NodeNumber: 1
    PerNodeResourceSpec:
      ResourcePriority: "GUARANTEED_PUBLIC"
      ResourceName: "cloudml.ng1gm402-8-8.20-224"
      ResourceNumber: 8
EnvConfigs:
  - Key: "PYTHONUNBUFFERED"
    Value: "1"
  - Key: "PYTHONPATH"
    Value: "/mnt/songzijun/Capability_Evolution/TRIM:/mnt/songzijun/Capability_Evolution/SCAPE-EasyOPD"
  - Key: "MAX_TURNS"
    Value: "40"
  - Key: "DISABLE_CUSTOM_ALL_REDUCE"
    Value: "1"
  - Key: "SCAPE_LOCAL_OPENAI_EMBEDDINGS"
    Value: "1"
  - Key: "SCAPE_FORCE_LOCAL_HARMONY"
    Value: "1"
  - Key: "SCAPE_CHROMA_PATH"
    Value: "/tmp/empty_chroma"
  - Key: "SCAPE_SEC_RL_DATA"
    Value: "/mnt/songzijun/Capability_Evolution/TRIM/data/harness-1-rl-data"
  - Key: "SCAPE_SEC_CORPUS_ROOT"
    Value: "/mnt/songzijun/Capability_Evolution/TRIM/data/harness-1-sec-corpus"
  - Key: "TIKTOKEN_ENCODINGS_BASE"
    Value: "/tmp/tiktoken-bundle/share/tiktoken"
  - Key: "TIKTOKEN_RS_CACHE_DIR"
    Value: "/tmp/tiktoken-bundle/tiktoken_rs_cache"
  - Key: "TIKTOKEN_CACHE_DIR"
    Value: "/tmp/tiktoken-bundle/tiktoken_cache"
  - Key: "PYTORCH_CUDA_ALLOC_CONF"
    Value: "expandable_segments:True"
Preemptible: false
EnableTensorboard: false
EnableMetrics: false
RetryConfig:
  EnableRetry: false
  MaxRetryTimes: 1
  PolicySets:
    - "JobFailed"
DiagOptions:
  - Name: "HangDetection"
    Enable: false
AlertConfig:
  EnableAlert: true
  AlertItems:
    - AlertConditions:
        - "FAILED"
      AlertLevel: P2
      AlertReceivers:
        Persons:
          - songzijun
# JuiceFS 挂载不在此 YAML 定义；endpoint（juiceFsCluster=bj9-cloudml）
# 经 CLI --juicefs_mount_configs 显式传入（见提交命令）。
