JobName: "diag-glm4-32b-vllm029-toolcall-20260914"
Description: "Test GLM-4-32B-0414 tool calling under vLLM 0.29.0 (isolated, not the four-package lock). Start vLLM with glm45 parser, send one tool-call request, dump response."
AccessType: "PRIVATE"
ImageConfig:
  ImageUrl: "micr.cloud.mioffice.cn/songzijun/songzijun-cto:3050749-songzijun-cto"
  ImageCommand: |
    set -euxo pipefail
    export PYTHONUNBUFFERED=1
    export CUDA_VISIBLE_DEVICES=0
    python3 -c "import zipfile; zipfile.ZipFile('/mnt/songzijun/tiktoken-bundle.zip').extractall('/tmp')"
    export TIKTOKEN_ENCODINGS_BASE=/tmp/tiktoken-bundle/share/tiktoken
    # Isolated venv so we do NOT touch the four-package lock used by formal eval.
    python3 -m venv /tmp/vllm029env
    . /tmp/vllm029env/bin/activate
    python -m pip install --no-cache-dir --upgrade pip
    python -m pip install --no-cache-dir "vllm==0.29.0" 2>&1 | tail -5

    echo "=== vllm + torch versions ==="
    python3 -c "import vllm, torch, transformers; print('vllm', vllm.__version__, 'torch', torch.__version__, 'transformers', transformers.__version__)"
    echo "=== registered tool parsers ==="
    python3 - <<'PY'
    import vllm.tool_parsers
    from vllm.tool_parsers.abstract_tool_parser import ToolParserManager
    print(sorted(ToolParserManager.tool_parsers.keys()))
    PY

    echo "=== START vLLM 0.29.0 glm45 parser ==="
    CUDA_VISIBLE_DEVICES=0 nohup vllm serve /mnt/songzijun/models/GLM-4-32B-0414 \
      --host 127.0.0.1 --port 8090 --served-model-name GLM-4-32B-0414 \
      --enable-auto-tool-choice --tool-call-parser glm45 \
      --max-model-len 8192 --trust-remote-code --gpu-memory-utilization 0.90 --max-num-seqs 8 --enforce-eager \
      > /tmp/vllm_glm.log 2>&1 &
    VLLM_PID=$!
    for i in $(seq 1 120); do
      curl -sf http://127.0.0.1:8090/v1/models >/dev/null 2>&1 && { echo "VLLM_READY after ${i}0s"; break; }
      sleep 10
    done
    curl -sf http://127.0.0.1:8090/v1/models >/dev/null 2>&1 || { echo "VLLM NOT READY"; tail -60 /tmp/vllm_glm.log; exit 1; }

    echo "=== TOOL CALL TEST (glm45, tool_choice=auto) ==="
    python3 /mnt/songzijun/Capability_Evolution/TRIM/scripts/toolcall_test.py
    echo "DIAG_DONE"
    kill $VLLM_PID 2>/dev/null || true
QueueId: "2334"
Priority: 8
Framework: "pytorch"
Preemptible: false
ResourceConfigs:
  - NodeRole: "worker"
    NodeNumber: 1
    PerNodeResourceSpec:
      ResourcePriority: "GUARANTEED_PUBLIC"
      ResourceName: "cloudml.ng1gm402-8-8.20-224"
      ResourceNumber: 1
Tags:
  - "MemQA-General-V5"
