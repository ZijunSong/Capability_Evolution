# CloudML custom_train: TRIM Harness-1 BC+, Qwen3-4B-Instruct-2507 (original
# bf16, dense 4B, NOT dequant), full RL (CISPO, H_zero baseline,
# --train_method rl --component zero) via torch_ddp_lora backend, FOUR 8-GPU
# gm402-80g nodes (4 nodes x 8 cards = 32 GPUs), 200 steps.
#
# === THIS VARIANT: final-answer recall + turn-count penalty reward + TensorBoard ===
# Built on the 9ixnl-verified Qwen3-4B rl/zero 32gpu YAML. Three deltas vs 9ixnl:
#   1. Reward formula: the active path
#      (trim.training.four_cell_runtime.terminal_reward_breakdown, called by
#      trainer_adapter via four_cell_runtime — NOT harness-1's external
#      compute_reward) is pure final-answer recall; this job enables the
#      turn-count penalty via TRIM_REWARD_MODE=recall_turn (total = recall -
#      0.15*(n_turns/40), env-gated; leaving it unset reproduces 9ixnl).
#   2. TensorBoard + metrics: enableTensorboard=true + enableMetrics=true make
#      the platform inject $TENSORBOARD_LOG_PATH, which
#      trainer_adapter._make_tensorboard_writer picks up (writes reward/ loss/
#      cispo/ tokens/ timing_s/ mem/ scalar blocks every optimizer step;
#      turn_penalty_mean / n_turns_mean are now in the reward block). JSONL
#      metrics.jsonl / step_timing.jsonl / turn_samples.jsonl also written
#      under <OUT>/rl/ as a fallback for offline plotting.
#   3. Independent jobName + OUT (-recall-turn-punish) so this run does NOT
#      collide with 9ixnl's provenance; distinct --rdzv-id.
#
# === Everything else identical to 9ixnl ===
#  * Dense bf16 4B (7.6G), NOT mxfp4. NO triton_kernels / Marlin / TRITON_UNFUSED.
#    vLLM 0.19.1 loads Qwen3 via standard bf16 + LoRA. 3 DDP patches still
#    required (startup_timeout / 4-tuple / EADDRINUSE).
#  * SCAPE_FORCE_LOCAL_HARMONY=1 SET (harmless on Qwen3-4B is_hf_chat_family).
#  * mb=4 (Qwen3-4B dense backward can grad-ckpt; NOT gpt-oss mb1-only OOM floor).
#  * rl/zero has no teacher curate projection, so curate-clipping patch NOT
#    required (only 3 DDP-generic patches asserted in entry PATCH_CHECK).
#
# === Multi-node risks (most retired by 7nzzn/9ixnl 2026-09-25) ===
# 1. PyTorchJob CRD injection: custom_train framework=pytorch nodeNumber=4
#    creates a PyTorchJob CRD with master-0/worker pods + init-pytorch that
#    injects MASTER_ADDR/NODE_RANK (NOT RANK/WORLD_SIZE). The entry unsets the
#    rank env defensively so run_train_multinode.py self-launches torchrun.
# 2. starfs-user-pv FailedMount: 2026-09-15 probe hit this; 7nzzn/9ixnl did NOT
#    (platform issue resolved). Low risk now, still watch events.
# 3. cross-node nccl object collectives: 7nzzn verified Gloo rendezvous + object
#    ops work cross-4-node (PyTorch auto-uses Gloo for
#    broadcast_object_list/all_gather_object). Risk retired.
# 4. workspace quota: kscn gm402 GUARANTEED_PUBLIC LEFT=0; 7nzzn/9ixnl
#    scheduled despite this. 32-GPU gang may queue if pool is busy.
# 5. GPU contention at submit time: queue 2334 RESOURCEFREE / idle FREE depend
#    on how many 32-GPU gangs are running. Check cml queue list / queue pending /
#    resource idle list at submit; verify with cml custom_train describe
#    (state + events Scheduled/Unschedulable/FailedQueueScheduling) after.
#
# IMPORTANT: JuiceFS endpoint is NOT submitted via this YAML (--filename) path.
# The actual submit uses direct CLI flags and passes --juicefs_mount_configs
# JSON explicitly, where juiceFsCluster must be "bj9-cloudml" (the schema field
# is juiceFsCluster; there is no literal "endpoint" key; its value IS the
# cluster/endpoint identifier, verified by 7nzzn describe juiceFSCluster field).
# This file is a readable draft / audit snapshot only; submit via
# submit_qwen3_4b_rl_ddp_200step_zero_recall_turn_punish_32gpu_4node_20260928.sh.
#
# world_size=32 is REQUIRED (4 nodes, 8 ranks/node via torchrun --nnodes 4
# --nproc_per_node 8). Post-submit provenance audit (CLAUDE.md): verify
# world_size is truly 32 by the three-tuple — (1) stdout has torchrun
# --nnodes 4 --nproc_per_node 8; (2) checkpoints/<cell>/step_000001/ has
# optimizer.pt (DDP rank0-merged single file, NOT FSDP2 sharded); (3)
# vllm_sessions/ has 32 _r0.._r31 sessions. Plus reward audit: stdout PREFLIGHT
# must show reward_mode=recall_turn; metrics.jsonl reward_parts_last must show
# protocol=final_answer_recall_plus_turn_penalty + turn_penalty>0.
#
# imageCommand below is a PLACEHOLDER — the entry script has bash heredocs
# and nested indentation, so inlining it as a YAML block scalar breaks parsing.
# The actual submission passes it via the CLI flag
# --image_command "$(cat entry_qwen3_4b_rl_ddp_200step_zero_recall_turn_punish_32gpu_4node_20260928.sh)"
# in the submit script. This YAML is an audit snapshot of resource/env/
# JuiceFS config; do NOT submit with --filename.

jobName: trim-harness1-bcplus-full-qwen3-4b-rl-ddp-200step-zero-recall-turn-punish-32gpu-4node-20260928
description: >-
  TRIM Harness-1 BC+ full RL (CISPO, H_zero baseline, --train_method rl
  --component zero) Qwen3-4B-Instruct-2507 (dense bf16 4B) on FOUR 8-GPU
  gm402-80g nodes (32 GPUs) via torch_ddp_lora backend. 9ixnl variant with 2
  deltas: (1) reward = final-answer recall + turn-count penalty
  (TRIM_REWARD_MODE=recall_turn, total=recall-0.15*(n_turns/40), env-gated
  off=9ixnl pure recall); active path is
  four_cell_runtime.terminal_reward_breakdown, NOT harness-1 external
  compute_reward. (2) TensorBoard+metrics on; trainer_adapter writer reads
  $TENSORBOARD_LOG_PATH, writes reward/loss/cispo/tokens/timing_s/mem scalars
  + turn_penalty_mean/n_turns_mean; JSONL metrics.jsonl/step_timing/turn_samples
  fallback. run_train_multinode.py --nnodes 4 --nproc-per-node 8 self-torchruns
  world_size=32: per-rank vLLM TP=1 rollout + DDP LoRA CISPO optimizer step.
  200 steps, 32 groups/step, group-size 8, max-turns 40, max-model-len 8192,
  mb=4 (Qwen3-4B dense backward can grad-ckpt), gpu-mem 0.90, local_legacy
  BM25, SEC RL data + corpus under TRIM/data, offline tiktoken, four-pack
  torch2.10.0/vllm0.19.1/tf4.57.6/pyserini2.0.0. Entry unsets CloudML-injected
  RANK/WORLD_SIZE/PET_* so main() self-launches torchrun (deterministic 4-node
  rendezvous via --master-addr/--node-rank). SCAPE_FORCE_LOCAL_HARMONY=1 SET
  (harmless on Qwen). Model cp to /tmp per node (4-way JuiceFS read, not 32-way).
  rl/zero has no teacher curate projection, so curate-clipping patch NOT
  required (only 3 DDP-generic patches asserted). RDMA on (>=2 nodes x 8 GPU).
  world_size=32 + reward_mode=recall_turn audit required post-submit.
accessType: PRIVATE
tags:
- MemQA-General-V5
imageConfig:
  imageUrl: micr.cloud.mioffice.cn/songzijun/songzijun-cto:3050749-songzijun-cto
  imageCommand: "FILLED_BY_SUBMIT_SCRIPT_VIA_cat_entry"
  # NOTE: imageCommand is a bash entry script with heredocs and nested
  # indentation, so inlining it as a YAML block scalar breaks parsing. The
  # actual submission passes it via the CLI flag
  # --image_command "$(cat entry_qwen3_4b_rl_ddp_200step_zero_recall_turn_punish_32gpu_4node_20260928.sh)"
  # in submit_qwen3_4b_rl_ddp_200step_zero_recall_turn_punish_32gpu_4node_20260928.sh.
  # This YAML is an audit snapshot of resource/env/JuiceFS config; do NOT
  # submit with --filename (use the submit script). The entry file is kept in
  # sync with imageConfig above.
juiceFsMountConfigs:
- volume: songzijun
  juiceFsCluster: bj9-cloudml
  subPath: /
  mountPath: /mnt/songzijun
  readOnly: false
envConfigs:
- key: PYTHONUNBUFFERED
  value: '1'
- key: CUDA_VISIBLE_DEVICES
  value: 0,1,2,3,4,5,6,7
- key: TRIM_GPU_KEEPALIVE
  value: '0'
- key: PYTORCH_CUDA_ALLOC_CONF
  value: expandable_segments:True
- key: PYTHONPATH
  value: /mnt/songzijun/Capability_Evolution/TRIM:/mnt/songzijun/Capability_Evolution/SCAPE-EasyOPD
- key: OPENAI_API_KEY
  value: '**-****-***********-***-*-****-***'
- key: SCAPE_LOCAL_OPENAI_EMBEDDINGS
  value: '1'
- key: SCAPE_FORCE_LOCAL_HARMONY
  value: '1'
- key: TIKTOKEN_ENCODINGS_BASE
  value: /tmp/tiktoken-bundle/share/tiktoken
- key: TIKTOKEN_CACHE_DIR
  value: /tmp/tiktoken-bundle/tiktoken_cache
- key: TIKTOKEN_RS_CACHE_DIR
  value: /tmp/tiktoken-bundle/tiktoken_rs_cache
- key: TRIM_REWARD_MODE
  value: recall_turn
- key: TRIM_TURN_PENALTY
  value: '0.15'
- key: TRIM_TURN_NORM
  value: '40'
- key: OUT
  value: /mnt/songzijun/outputs/qwen3-4B-rl-recall-turn-punish-32gpu_20260928
queueId: '2334'
priority: 8
preemptible: false
framework: pytorch
rdma: true
resourceConfigs:
- nodeRole: worker
  nodeNumber: 4
  perNodeResourceSpec:
    resourcePriority: GUARANTEED_PUBLIC
    resourceName: cloudml.ng1gm402-8-8.20-224
    resourceNumber: 8
  elastic: false
  preemptible: false
enableTensorboard: true
enableMetrics: true
retryConfig:
  enableRetry: false
  maxRetryTimes: 1
  policySets:
  - JobFailed
diagOptions:
- name: HangDetection
  enable: false
alertConfig:
  enableAlert: true
  alertItems:
