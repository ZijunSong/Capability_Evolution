  stopped@20/200, clean exit STEP_COMPLETE=1, ckpt complete). GATED turn penalty
  reward=recall-0.15*(n_turns/40)*[rec>0]. mb4 gpu-mem0.90 max-turns40.
  curate-clipping patch asserted. priority2. world_size=32 audit.
