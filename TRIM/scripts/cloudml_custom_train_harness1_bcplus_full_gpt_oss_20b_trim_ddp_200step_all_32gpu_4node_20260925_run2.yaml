# CloudML custom_train: TRIM Harness-1 BC+, GPT-OSS-20B (original mxfp4,
# non-dequant per user instruction), trim (SR-OPD / CISPO distill,
# --train_method trim --component all) via torch_ddp_lora backend, FOUR 8-GPU
# gm402-80g nodes (4 nodes x 8 cards = 32 GPUs), 200 steps.
#
# This is the MULTI-NODE variant of the single-node trim/all entry
# (entry_gptoss20b_trim_ddp_100step_8gpu_recov1.sh, the ethqp path). The
# single-node trim entry execs run_train.py; this YAML's entry execs
# run_train_multinode.py, which is the real multi-node launcher: each node runs
# ONE Scheme A process that itself torchruns --nnodes 4 --nproc_per_node 8
# (world_size=32), shards on-policy query groups across 32 ranks, gathers
# rollout trajectories onto rank 0 via shared disk (<out>/tmp/rollout_shards),
# rank 0 runs the DDP-LoRA CISPO/OPD optimizer step, then every rank barriers
# and reloads the fresh adapter for the next on-policy rollout.
#
# === PATH NOTE: trim/all (NOT rl/zero) — FIRST multi-node trim/all submission ===
# The existing 200step_zero / 100step_zero multi-node entries (7nzzn / ghynp,
# both RUNNING) are --train_method rl --component zero (H_zero RL baseline).
# THIS YAML's entry is --train_method trim --component all (SR-OPD + RL joint
# distill, the CISPO teacher-student path). The trim/all path has NEVER been
# run multi-node before; single-node it is the ethqp/axztt path. The
# distinguishing code-tree dependency of trim/all is the curate-clipping
# tolerant-skip patch (action_is_visible + tinker_opd_datum skip path),
# without which step0 datum build aborts on "projected curate refs docs not
# visible after clipping" (x2j3u FAILED@step0, fixed in ethqp). The entry's
# PATCH_CHECK asserts it.
#
# === Multi-node risks (most retired by 7nzzn 2026-09-25) ===
# 1. PyTorchJob CRD injection: custom_train framework=pytorch nodeNumber=4
#    creates a PyTorchJob CRD with master-0/worker pods + init-pytorch that
#    injects MASTER_ADDR/NODE_RANK (NOT RANK/WORLD_SIZE, verified by 7nzzn
#    PREFLIGHT rank_env=None world_size_env=None). The entry unsets the rank
#    env defensively so run_train_multinode.py self-launches torchrun.
# 2. starfs-user-pv FailedMount: the 2026-09-15 probe was killed at deploying
#    because CloudML multi-node auto-injects a starfs-user-pv volume that
#    failed to mount. 7nzzn (2026-09-25) did NOT hit this (platform issue
#    resolved). Low risk now, still watch events.
# 3. cross-node nccl object collectives: 7nzzn verified Gloo rendezvous +
#    object ops work cross-4-node (PyTorch auto-uses Gloo for
#    broadcast_object_list/all_gather_object). Risk retired by 7nzzn.
# 4. workspace quota: kscn gm402 GUARANTEED_PUBLIC LEFT=0; 7nzzn (32-GPU gang)
#    was scheduled despite this, so the public pool does NOT strictly block at
#    LEFT=0. Still, 32-GPU gang may queue if pool is busy.
# 5. GPU contention (2026-09-25 specific): 7nzzn (200step zero, RUNNING) +
#    ghynp (100step zero, RUNNING) occupy 64 cards together. queue 2334
#    RESOURCEFREE=16, idle FREE=30, quota LEFT=0. A third 32-GPU gang CANNOT
#    schedule until 7nzzn or ghynp releases; it will queue at
#    FailedQueueScheduling "insufficient resource ... left X, request 32"
#    (exactly as 7nzzn itself did at 09:37 before resources freed at 09:38).
#
# IMPORTANT: JuiceFS endpoint is NOT submitted via this YAML (--filename) path.
# The actual submit uses direct CLI flags and passes --juicefs_mount_configs
# JSON explicitly, where juiceFsCluster must be "bj9-cloudml" (the schema field
# is juiceFsCluster; there is no literal "endpoint" key; its value IS the
# cluster/endpoint identifier, verified by 7nzzn describe juiceFSCluster field).
# This file is a readable draft / audit snapshot only; submit via
# submit_gpt_oss_20b_trim_ddp_200step_all_32gpu_4node_20260925.sh.
#
# world_size=32 is REQUIRED (4 nodes, 8 ranks/node via torchrun --nnodes 4
# --nproc_per_node 8). Post-submit provenance audit (CLAUDE.md): verify
# world_size is truly 32 by the three-tuple — (1) stdout has torchrun
# --nnodes 4 --nproc_per_node 8; (2) checkpoints/<cell>/step_000001/ has 32
# optimizer.rank0000..0031.pt; (3) vllm_sessions/ has 32 _r0.._r31 sessions.
# Any one missing => actually single-node or partial run, result is NOT a
# valid "32-GPU 4-node DDP" artifact.
#
# imageCommand below is a PLACEHOLDER — the entry script has bash heredocs
# and nested indentation, so inlining it as a YAML block scalar breaks
# parsing (confirmed during run2 prep). The actual submission passes it via
# the CLI flag --image_command "$(cat entry_..._trim_..._32gpu_4node_...sh)"
# in the submit script. This YAML is an audit snapshot of resource/env/
# JuiceFS config; do NOT submit with --filename.

jobName: trim-harness1-bcplus-full-gpt-oss-20b-trim-ddp-200step-all-32gpu-4node-20260925-run2-bf16
description: >-
  TRIM Harness-1 BC+ trim (SR-OPD/CISPO distill, --train_method trim
  --component all) GPT-OSS-20B (original mxfp4, non-dequant per user) on FOUR
  8-GPU gm402-80g nodes (32 GPUs) via torch_ddp_lora backend. FIRST multi-node
  trim/all run (7nzzn/ghynp are rl/zero). run_train_multinode.py --nnodes 4
  --nproc-per-node 8 self-torchruns world_size=32: per-rank vLLM TP=1 rollout
  + DDP LoRA CISPO/OPD optimizer step (full replica per rank, not FSDP2
  sharding). 200 steps, 32 groups/step, group-size 8, max-turns 40 (NOT
  default 6; MAX_TURNS env is a no-op), max-model-len 8192, mb=1 (gpt-oss MoE
  backward OOM safe floor; mb>=2 OOMs per k6v0p), gpu-mem 0.90, local_legacy
  BM25, SEC RL data + corpus under TRIM/data, offline tiktoken, four-pack
  torch2.10.0/vllm0.19.1/tf4.57.6/pyserini2.0.0. Entry unsets
  CloudML-injected RANK/WORLD_SIZE/PET_* so main() self-launches torchrun
  (deterministic 4-node rendezvous via --master-addr/--node-rank). NO
  CUDA_LAUNCH_BLOCKING (DDP multi-proc). NO DISABLE_CUSTOM_ALL_REDUCE (TP=1).
  SCAPE_FORCE_LOCAL_HARMONY unset (gpt-oss to_json crash). Model cp to /tmp
  per node (4-way JuiceFS read, not 32-way). trim/all-specific
  curate-clipping patch (action_is_visible + tinker_opd_datum skip) asserted
  in PATCH_CHECK (x2j3u FAILED without it). RDMA on (>=2 nodes x 8 GPU).
  Multi-node risks (most retired by 7nzzn): starfs-user-pv FailedMount (7nzzn
  did NOT hit), cross-node object collectives (7nzzn verified Gloo
  rendezvous works), workspace quota LEFT=0 (7nzzn scheduled despite it).
  GPU contention: 7nzzn+ghynp occupy 64 cards, this third 32-GPU gang WILL
  queue until resources free. world_size=32 audit required post-submit.
accessType: PRIVATE
tags:
- MemQA-General-V5
imageConfig:
  imageUrl: micr.cloud.mioffice.cn/songzijun/songzijun-cto:3050749-songzijun-cto
  imageCommand: "FILLED_BY_SUBMIT_SCRIPT_VIA_cat_entry"
  # NOTE: imageCommand is a bash entry script with heredocs and nested
  # indentation, so inlining it as a YAML block scalar breaks parsing. The
  # actual submission passes it via the CLI flag
  # --image_command "$(cat entry_gpt_oss_20b_trim_ddp_200step_all_32gpu_4node_20260925.sh)"
  # in submit_gpt_oss_20b_trim_ddp_200step_all_32gpu_4node_20260925.sh. This
  # YAML is an audit snapshot of resource/env/JuiceFS config; do NOT submit
  # with --filename (use the submit script). The entry file is kept in sync
  # with imageConfig above.
juiceFsMountConfigs:
- volume: songzijun
  juiceFsCluster: bj9-cloudml
  subPath: /
  mountPath: /mnt/songzijun
  readOnly: false
