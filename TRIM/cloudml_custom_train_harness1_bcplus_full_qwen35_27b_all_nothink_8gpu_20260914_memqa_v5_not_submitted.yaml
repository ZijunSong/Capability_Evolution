#
# JuiceFS is intentionally omitted here. Submit with the direct CLI
# --juicefs_mount_configs argument so endpoint/cluster=bj9-cloudml is explicit
# (CLAUDE.md: JuiceFS endpoint must NOT go through the YAML --filename path).
#
# Pending risks the operator should confirm before submitting:
#   1. vLLM 0.19.1 support for Qwen3_5ForConditionalGeneration is unverified locally
#      (host transformers 5.17.0, no vllm). The launch script runs a vLLM
