# CloudML custom_train configuration for TRIM Harness-1 BC+ full pat-jj/harness-1 "all" eval.
# Prepared 2026-09-14; NOT SUBMITTED. tag=MemQA-General-V5, priority=8.
#
# Tested model: /mnt/songzijun/models/pat-jj_harness-1-full/harness-1 — the official pat-jj
# Harness-1 release checkpoint. It is a gpt-oss-20b MoE ALREADY DEQUANTIZED to bf16
# (config.json: architectures=[GptOssForCausalLM], dtype=bfloat16, NO quantization_config,
# 32 experts / 4 per token). So it follows the SAME lib code path as gpt-oss-20b, but does
# NOT touch the mxfp4+LoRA Marlin PTX failure mode (no quantization_config, and eval loads
# NO LoRA adapter). The 20260913 gpt-oss-20B "all" run (qx086, 830/830 leak=0, Recall=0.1684,
# formal artifact) is the closest successful precedent; this YAML is derived from it with the
# minimal changes the new checkpoint requires.
#
# Entrypoint script: scripts/run_bcplus_w_harness1_patjj_harness1_all_gpu8_eval.sh (NEW).
#   It is a clone of run_bcplus_w_harness1_gptoss_all_gpu8_eval.sh with model identity changed
#   to the pat-jj release checkpoint. The gpt-oss wrapper HARDCODES MODEL_SLUG="gpt-oss-20b"
#   (no env override); reusing it would MISLABEL the output dir / provenance as gpt-oss-20b
#   while running a different checkpoint. The new wrapper sets MODEL_SLUG=harness-1 (so lib's
#   vllm_extra_for_model picks the gpt-oss branch: --tool-call-parser openai --max-model-len
#   32768 --moe-backend triton), MODEL_PATH/API_MODEL=harness-1, RUN_ID=..._patjj_harness1_*.
#   --component=all is fixed by the wrapper; COMPONENT=all is asserted by the lib.
#
# Native 8-GPU topology (lib defaults, unchanged):
#   "all" = 6 single-card actor vLLMs (GPU 0-5, ports 8042/8044/8046/8048/8052/8054)
#           + 1 harness-1 verifier vLLM (GPU 6, port 8050). GPU 7 unused for the all pass.
#   ALL_TP=6, ALL_EVAL_TP=64. --tp is the data-parallel eval-replica count, NOT vLLM tensor
#   parallel; each vLLM stays single-card (TP=1). run_eval.py clamps eval_replicas to
#   max(eval_replicas, len(actor_urls)) and round-robins (rank%6) across the 6 actor URLs.
#   GPU_UTIL=0.90, VLLM_MAX_NUM_SEQS=128, WORKER_STAGGER=5 — match the succeeded qx086 eval
#   (do not tune the scorer/runtime to fit an expectation; CLAUDE.md).
#   --enforce-eager is applied by start_vllm_bg (gm402 has no flash-attn -> SDPA + eager).
#   Verifier (VERIFY_MODEL_PATH=../../models/harness-1) resolves to the SAME checkpoint via
#   symlink (models/harness-1 -> pat-jj_harness-1-full/harness-1); actor served="harness-1"
#   vs verifier served="harness-1-verifier" on disjoint GPU/port, no aliasing.
#
# No Chroma server dependency:
#   --retrieval-backend local_bm25 --reranker none --offline (run_eval_cell).
#   HARNESS1_FORBID_CHROMA=1 (lib line 40 + harness1_api_worker.py), SCAPE_CHROMA_PATH=
#   /tmp/empty_chroma forces chromadb.PersistentClient (embedded) if the branch is ever hit.
#
# Locked four-package runtime (CLAUDE.md "TRIM Harness-1 BC+" audit baseline, MUST NOT mix
# with Transformers 5.x / Pyserini 2.4.0 results): Torch 2.10.0 / Transformers 4.57.6 /
# vLLM 0.19.1 / Pyserini 2.0.0. Plus the upstream_api import-chain deps the base image
# 3050749 lacks: chz / tinker / json_repair.
#   - chz/tinker installed with --no-deps so tinker's unconstrained transformers pin does NOT
#     upgrade transformers to 5.x and break the vllm 0.19.1 pin. Installed AFTER the four-pkg
#     pin so the lock is in place.
#   - A self-healing load_upstream_modules() loop catches any remaining ModuleNotFoundError,
#     pip-installs the top-level package (chz/tinker via --no-deps) and retries, so missed
#     deps surface at startup (~minutes) instead of after the 6 actors + verifier boot.
#
# harness-1 uses the real openai_harmony encoder -> offline tiktoken bundle (o200k_base)
# extracted to /tmp/tiktoken-bundle and wired via TIKTOKEN_ENCODINGS_BASE / _RS_CACHE_DIR /
# _CACHE_DIR. There is NO separate o200k_harmony.tiktoken; harmony loads the same
# o200k_base.tiktoken + Harmony special tokens (per the bundle MANIFEST). This is REQUIRED
# for the vLLM actor subprocess (--tool-call-parser openai) which runs openai_harmony at
# APIServer init and would otherwise try to download o200k_base.tiktoken from Azure and fail
# (CloudML has no public egress). The three TIKTOKEN env are exported in the shell so the
# nohup'd vLLM child inherits them.
#
# JuiceFS is intentionally OMITTED from this YAML. Submit with the direct CLI
# --juicefs_mount_configs argument so endpoint=bj9-cloudml is explicit in the API request
# (see submit_..._not_submitted.sh). Do NOT use the YAML --filename path for mounts.
jobName: "eval-bcplus-full-patjj-harness1-all-8gpu-20260914-memqa-general-v5"
description: "Harness-1 BC+ full pat-jj/harness-1 (gpt-oss-20b arch, bf16, no quant) 'all' eval on 8x gm402-80g via run_bcplus_w_harness1_patjj_harness1_all_gpu8_eval.sh (6 actor vLLM GPU0-5 + 1 verify GPU6, ALL_EVAL_TP=64), local_bm25 retrieval (no Chroma), offline tiktoken o200k_base + Pyserini/JVM preflight + chz/tinker/json_repair import-chain deps. Fresh 20260914 attempt. Closest precedent: gpt-oss-20B all 20260913 (qx086, 830/830 leak=0 Recall0.1684)."
accessType: "PRIVATE"
tags:
  - "MemQA-General-V5"

imageConfig:
  imageUrl: "micr.cloud.mioffice.cn/songzijun/songzijun-cto:3050749-songzijun-cto"
  imageCommand: |-
    set -euxo pipefail
    export PYTHONUNBUFFERED=1
    export CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
    export PY=python3
    export VLLM=vllm
    export VLLM_DISABLE_CUSTOM_ALL_REDUCE=1
    export OPENAI_API_KEY="${OPENAI_API_KEY:-*****-*******-***********}"
    export SCAPE_LOCAL_OPENAI_EMBEDDINGS=1
    export SCAPE_CHROMA_PATH=/tmp/empty_chroma
    mkdir -p "$SCAPE_CHROMA_PATH"

    # --- offline tiktoken: harness-1 harmony encoder needs o200k_base ---
    # No separate o200k_harmony.tiktoken exists; harmony loads o200k_base + special tokens.
    # Required for the vLLM actor subprocess (--tool-call-parser openai) which runs
    # openai_harmony at APIServer init; without the local vocab it tries Azure and fails.
    python3 -c "import zipfile; zipfile.ZipFile('/mnt/songzijun/tiktoken-bundle.zip').extractall('/tmp')"
    test -f /tmp/tiktoken-bundle/share/tiktoken/o200k_base.tiktoken
    test -f /tmp/tiktoken-bundle/share/tiktoken/cl100k_base.tiktoken
    export TIKTOKEN_ENCODINGS_BASE=/tmp/tiktoken-bundle/share/tiktoken
    export TIKTOKEN_RS_CACHE_DIR=/tmp/tiktoken-bundle/tiktoken_rs_cache
    export TIKTOKEN_CACHE_DIR=/tmp/tiktoken-bundle/tiktoken_cache

    nvidia-smi -L
    test -f /mnt/songzijun/Capability_Evolution/TRIM/scripts/run_bcplus_w_harness1_patjj_harness1_all_gpu8_eval.sh
    test -f /mnt/songzijun/Capability_Evolution/TRIM/scripts/lib_bcplus_w_harness1_gpu8_eval.sh
    test -f /mnt/songzijun/Capability_Evolution/TRIM/scripts/run_eval.py
    test -f /mnt/songzijun/Capability_Evolution/TRIM/scripts/build_browsecomp_corpus_from_index.py
    test -d /mnt/songzijun/models/pat-jj_harness-1-full/harness-1
    test -d /mnt/songzijun/models/harness-1
    test -d /mnt/songzijun/Capability_Evolution/SCOPE/external/BrowseComp-Plus/indexes/bm25
    test -f /mnt/songzijun/Capability_Evolution/SCOPE/external/BrowseComp-Plus/data/browsecomp_plus_corpus_full.jsonl

    # --- assert the tested model is the bf16 dequant pat-jj release (no quantization_config),
    #     so the mxfp4+LoRA Marlin PTX failure mode does NOT apply (and eval loads no LoRA). ---
    python3 - <<'PY'
    import json
    c = json.load(open("/mnt/songzijun/models/pat-jj_harness-1-full/harness-1/config.json"))
    assert c.get("architectures") == ["GptOssForCausalLM"], c.get("architectures")
    assert "quantization_config" not in c, "unexpected quantization_config — this eval assumes the bf16 dequant checkpoint"
    print("MODEL_CONFIG_OK", {"architectures": c.get("architectures"), "dtype": c.get("dtype"),
          "num_local_experts": c.get("num_local_experts"), "has_quant": "quantization_config" in c})
    PY

    # --- JVM for Pyserini Lucene (probe first; do not trust a non-empty JAVA_HOME) ---
    JVM_PATH=$(find /usr /opt -type f -name libjvm.so 2>/dev/null | head -1 || true)
    if [ -z "${JVM_PATH}" ]; then
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-21-jre-headless
      JVM_PATH=$(find /usr /opt -type f -name libjvm.so 2>/dev/null | head -1 || true)
    fi
    test -n "${JVM_PATH}"
    test -f "${JVM_PATH}"
    ldd "${JVM_PATH}"
    export JVM_PATH
    export JAVA_HOME=$(dirname "$(dirname "$(dirname "${JVM_PATH}")")")
    export LD_LIBRARY_PATH=$(dirname "${JVM_PATH}"):${LD_LIBRARY_PATH:-}

    # --- locked four-package runtime + harness import-chain deps (structlog/chromadb) ---
    # --ignore-installed because base image distutils `blinker 1.4` blocks pip uninstall
    # (internal Xiaomi PyPI). --no-deps NOT used for the four-package so their versions win.
    python3 -m pip install --no-cache-dir --ignore-installed --upgrade-strategy only-if-needed \
      "torch==2.10.0" "vllm==0.19.1" "transformers==4.57.6" "pyserini==2.0.0" \
      structlog chromadb tqdm sentence-transformers regex sympy latex2sympy2 word2number sentencepiece openai tenacity json_repair

    # --- chz / tinker with --no-deps so tinker's unconstrained transformers pin does NOT
    #     upgrade transformers to 5.x and break vllm 0.19.1. Installed AFTER the four-package
    #     pin so the lock is in place. chz has no __version__; use importlib.metadata. ---
    python3 -m pip install --no-cache-dir --no-deps chz tinker

    # --- ANSERINI_CLASSPATH -> pyserini resources/jars (NOT the package root) ---
    PYSERINI_ROOT=$(python3 -c 'import pathlib, pyserini; print(pathlib.Path(pyserini.__file__).resolve().parent)')
    export ANSERINI_CLASSPATH=$(find "$PYSERINI_ROOT/resources/jars" -type f -name '*.jar' -print | paste -sd: -)
    test -n "$ANSERINI_CLASSPATH"
    export CLASSPATH="$ANSERINI_CLASSPATH"

    # --- preflight: four versions + 8 GPU + PyJNI + Lucene bcplus index opens. ---
    # pyserini 2.0.0 has no __version__ attr -> importlib.metadata (NOT pyserini.__version__).
    # LuceneSearcher.num_docs is an ATTRIBUTE (int) in pyserini 2.0.0, not a method -> getattr.
    python3 - <<'PY'
    import importlib.metadata
    import os
    import torch
    import transformers
    import vllm
    from jnius import autoclass
    autoclass("java.lang.String")
    versions = {
        "torch": torch.__version__,
        "vllm": vllm.__version__,
        "transformers": transformers.__version__,
        "pyserini": importlib.metadata.version("pyserini"),
        "structlog": importlib.metadata.version("structlog"),
        "chromadb": importlib.metadata.version("chromadb"),
        "chz": importlib.metadata.version("chz"),
        "tinker": importlib.metadata.version("tinker"),
        "json_repair": importlib.metadata.version("json_repair"),
        "gpu_count": torch.cuda.device_count(),
        "JVM_PATH": os.environ["JVM_PATH"],
        "JAVA_HOME": os.environ["JAVA_HOME"],
        "TIKTOKEN_ENCODINGS_BASE": os.environ.get("TIKTOKEN_ENCODINGS_BASE"),
        "o200k_base_present": os.path.isfile(
            os.path.join(os.environ["TIKTOKEN_ENCODINGS_BASE"], "o200k_base.tiktoken")
        ),
        "java_ok": True,
    }
    print("PREFLIGHT", versions, flush=True)
    assert versions["torch"].startswith("2.10.0")
    assert versions["vllm"] == "0.19.1"
    assert versions["transformers"] == "4.57.6"
    assert versions["pyserini"] == "2.0.0"
    assert versions["gpu_count"] == 8
    assert versions["o200k_base_present"]
    from pyserini.search.lucene import LuceneSearcher
    s = LuceneSearcher("/mnt/songzijun/Capability_Evolution/SCOPE/external/BrowseComp-Plus/indexes/bm25")
    n_docs = s.num_docs if not callable(s.num_docs) else s.num_docs()
    print("LUCENE_OK", {"num_docs": n_docs}, flush=True)
    assert n_docs > 0
    PY

    # --- self-healing load_upstream_modules(): the upstream_api worker import chain pulls
    #     training.train_rl -> tinker_cookbook -> chz and harness.agent -> json_repair. Any
    #     still-missing top-level package is pip-installed (chz/tinker via --no-deps) and the
    #     import retried, so failures surface here, not after the 6 actors + verifier boot. ---
    export PYTHONPATH="/mnt/songzijun/Capability_Evolution:/mnt/songzijun/Capability_Evolution/TRIM:/mnt/songzijun/Capability_Evolution/SCAPE-EasyOPD:${PYTHONPATH:-}"
    python3 - <<'PY'
    import importlib, os, subprocess, sys
    NODE_DEPS = {"chz", "tinker"}  # must stay --no-deps to protect the transformers pin
    for _ in range(6):
        try:
            from trim.upstream_harness1.env_bridge import load_upstream_modules
            load_upstream_modules()
            print("IMPORT_CHAIN_OK", flush=True)
            break
        except ModuleNotFoundError as e:
            top = (e.name or "").split(".")[0]
            if not top:
                raise
            print(f"SELF_HEAL install missing top-level: {top}", flush=True)
            flag = "--no-deps" if top in NODE_DEPS else ""
            cmd = ["python3", "-m", "pip", "install", "--no-cache-dir"]
            if flag:
                cmd.append(flag)
            cmd.append(top)
            subprocess.check_call(cmd)
            importlib.invalidate_caches()
        else:
            print("IMPORT_CHAIN_OK (no retry needed)", flush=True)
            break
    PY

    # --- run the pat-jj/harness-1 "all" gpu8 eval script directly ---
    #   The script sources lib_bcplus_w_harness1_gpu8_eval.sh and calls lib_bcplus_gpu8_run_all,
    #   which runs harness-1 component=all only. It needs NO MODELS / SKIP_ZERO env.
    #   RUN_ID is overridden to a 20260914-stamped value so output/log dirs are isolated
    #   from prior attempts (outputs/eval_h1_bcplus_full_harness-1_all_gpu012345v6_<RUN_ID>).
    #   GPU_UTIL=0.90 + WORKER_STAGGER=5 match the succeeded qx086 gpt-oss all eval.
    #   Pure inference (no backward pass), so 0.90 is safe; the RL backward-OOM note does NOT
    #   apply to eval. No mxfp4+LoRA Marlin PTX risk: this checkpoint has no quantization_config
    #   and eval loads no LoRA adapter.
    export GPU_UTIL=0.90
    export WORKER_STAGGER=5
    export RUN_ID="$(date +%Y%m%d_%H%M%S)_patjj_harness1_all_gpu8"
    bash /mnt/songzijun/Capability_Evolution/TRIM/scripts/run_bcplus_w_harness1_patjj_harness1_all_gpu8_eval.sh

envConfigs:
  - key: "PYTHONUNBUFFERED"
    value: "1"
  - key: "CUDA_VISIBLE_DEVICES"
    value: "0,1,2,3,4,5,6,7"
  - key: "PYTHONPATH"
    value: "/mnt/songzijun/Capability_Evolution:/mnt/songzijun/Capability_Evolution/TRIM:/mnt/songzijun/Capability_Evolution/SCAPE-EasyOPD"
  - key: "VLLM_DISABLE_CUSTOM_ALL_REDUCE"
    value: "1"
  - key: "SCAPE_LOCAL_OPENAI_EMBEDDINGS"
    value: "1"
  - key: "SCAPE_CHROMA_PATH"
    value: "/tmp/empty_chroma"
  - key: "TIKTOKEN_ENCODINGS_BASE"
    value: "/tmp/tiktoken-bundle/share/tiktoken"
  - key: "TIKTOKEN_RS_CACHE_DIR"
    value: "/tmp/tiktoken-bundle/tiktoken_rs_cache"
  - key: "TIKTOKEN_CACHE_DIR"
    value: "/tmp/tiktoken-bundle/tiktoken_cache"

