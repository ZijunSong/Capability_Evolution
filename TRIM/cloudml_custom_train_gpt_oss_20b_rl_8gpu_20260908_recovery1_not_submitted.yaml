  imageCommand: >-
    set -euxo pipefail;
    export PYTHONUNBUFFERED=1;
    export CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7;
    export MAX_TURNS=40;
    export PYTHONPATH=/mnt/songzijun/Capability_Evolution/TRIM:/mnt/songzijun/Capability_Evolution/SCAPE-EasyOPD;
    nvidia-smi -L;
    test -f /mnt/songzijun/Capability_Evolution/TRIM/scripts/run_train.py;
    test -f /mnt/songzijun/models/openai/gpt-oss-20b/config.json;
    test -f /mnt/songzijun/Capability_Evolution/TRIM/data/harness-1-rl-data/manifest.json;
    test -f /mnt/songzijun/Capability_Evolution/TRIM/data/harness-1-sec-corpus/manifest.json;
    apt-get update;
    DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-21-jre-headless;
    export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64;
    export JVM_PATH=/usr/lib/jvm/java-21-openjdk-amd64/lib/server/libjvm.so;
    export LD_LIBRARY_PATH=/usr/lib/jvm/java-21-openjdk-amd64/lib/server:${LD_LIBRARY_PATH:-};
    test -f "$JVM_PATH";
    ldd "$JVM_PATH";
    python3 -m pip install --no-cache-dir --ignore-installed --upgrade-strategy only-if-needed "torch==2.10.0" "transformers==4.57.6" "accelerate==1.13.0" "datasets==4.8.4" "hydra-core==1.3.2" "omegaconf==2.3.0" "vllm==0.19.1" peft structlog chromadb tqdm regex sympy latex2sympy2 word2number sentencepiece pyserini openai tenacity anthropic;
    python3 -c 'import torch, transformers, vllm, pyserini; print("preflight", torch.__version__, transformers.__version__, vllm.__version__, torch.cuda.device_count(), pyserini.__file__); assert torch.cuda.device_count() == 8';
    cd /mnt/songzijun/Capability_Evolution;
    exec python3 /mnt/songzijun/Capability_Evolution/TRIM/scripts/run_train.py --harness Harness-1 --benchmark bcplus_full --model_name /mnt/songzijun/models/openai/gpt-oss-20b --train_method rl --component all --rl-data /mnt/songzijun/Capability_Evolution/TRIM/data/harness-1-rl-data --sec-corpus-root /mnt/songzijun/Capability_Evolution/TRIM/data/harness-1-sec-corpus --train-groups-per-step 32 --train-micro-batch-size 4 --train-heartbeat-every 8 --out /mnt/songzijun/Capability_Evolution/TRIM/outputs/cloudml_custom_train_harness1_bcplus_full_gpt_oss_20b_rl_8gpu_20260908_recovery1

