# CloudML recovery4 for TRIM Harness-1 RL after Pyserini num_docs API mismatch.
# JuiceFS remains CLI-only so bj9-cloudml is explicit at submission time.
jobName: "trim-harness1-bcplus-full-gpt-oss-20b-rl-8gpu-20260907-recovery4"
description: "Recovery4 TRIM Harness-1 BC+ full GPT-OSS-20B RL with corrected Lucene preflight"
accessType: "PRIVATE"

imageConfig:
  imageUrl: "micr.cloud.mioffice.cn/songzijun/songzijun-cto:3050749-songzijun-cto"
  imageCommand: >-
    set -euxo pipefail; export PYTHONUNBUFFERED=1; export CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7; export MAX_TURNS=40; export PYTHONPATH=/mnt/songzijun/Capability_Evolution/TRIM:/mnt/songzijun/Capability_Evolution/SCAPE-EasyOPD; export VLLM_DISABLE_CUSTOM_ALL_REDUCE=1; export OPENAI_API_KEY=sk-pyserini-local; nvidia-smi -L; apt-get update; DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-21-jre-headless; export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64; export JVM_PATH=/usr/lib/jvm/java-21-openjdk-amd64/lib/server/libjvm.so; export LD_LIBRARY_PATH=/usr/lib/jvm/java-21-openjdk-amd64/lib/server:${LD_LIBRARY_PATH:-}; test -f "$JVM_PATH"; ldd "$JVM_PATH"; python3 -m pip install --no-cache-dir --ignore-installed --upgrade-strategy only-if-needed "torch==2.10.0" "transformers==4.57.6" "accelerate==1.13.0" "datasets==4.8.4" "hydra-core==1.3.2" "omegaconf==2.3.0" "vllm==0.19.1" peft structlog chromadb tqdm regex sympy latex2sympy2 word2number sentencepiece pyserini; python3 -c 'import torch, transformers, vllm, pyserini, peft; from pyserini.search.lucene import LuceneSearcher; p="/mnt/songzijun/Capability_Evolution/TRIM/data/harness-1-sec-corpus/indexes/bm25"; s=LuceneSearcher(p); print("preflight", torch.__version__, transformers.__version__, vllm.__version__, torch.cuda.device_count(), pyserini.__file__, peft.__version__, s.num_docs); assert torch.cuda.device_count() == 8 and s.num_docs > 0'; test -f /mnt/songzijun/Capability_Evolution/TRIM/data/harness-1-rl-data/manifest.json; test -f /mnt/songzijun/Capability_Evolution/TRIM/data/harness-1-sec-corpus/indexes/bm25/BUILD.json; cd /mnt/songzijun/Capability_Evolution; exec python3 /mnt/songzijun/Capability_Evolution/TRIM/scripts/run_train.py --harness Harness-1 --benchmark bcplus_full --model_name /mnt/songzijun/models/openai/gpt-oss-20b --train_method rl --component all --rl-data /mnt/songzijun/Capability_Evolution/TRIM/data/harness-1-rl-data --sec-corpus-root /mnt/songzijun/Capability_Evolution/TRIM/data/harness-1-sec-corpus --train-groups-per-step 32 --train-micro-batch-size 4 --train-heartbeat-every 8 --out /mnt/songzijun/Capability_Evolution/TRIM/outputs/cloudml_trim_harness1_bcplus_full_gpt_oss_20b_rl_8gpu_20260907_recovery4

envConfigs:
  - key: "PYTHONUNBUFFERED"
    value: "1"
  - key: "CUDA_VISIBLE_DEVICES"
    value: "0,1,2,3,4,5,6,7"
  - key: "MAX_TURNS"
    value: "40"
  - key: "PYTHONPATH"
    value: "/mnt/songzijun/Capability_Evolution/TRIM:/mnt/songzijun/Capability_Evolution/SCAPE-EasyOPD"
  - key: "VLLM_DISABLE_CUSTOM_ALL_REDUCE"
    value: "1"
  - key: "OPENAI_API_KEY"
    value: "sk-pyserini-local"

queueId: "2334"
priority: 5
preemptible: false
framework: "pytorch"
resourceConfigs:
  - nodeRole: "worker"
    nodeNumber: 1
    perNodeResourceSpec:
      resourcePriority: "GUARANTEED_PUBLIC"
      resourceName: "cloudml.ng1gm402-8-8.20-224"
      resourceNumber: 8
    elastic: false
    preemptible: false

enableTensorboard: false
enableMetrics: false
diagOptions:
  - name: "HangDetection"
    enable: false
retryConfig:
  enableRetry: false
  maxRetryTimes: 1
  policySets:
    - "JobFailed"
