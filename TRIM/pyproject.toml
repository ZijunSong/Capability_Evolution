[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trim"
version = "0.1.0"
description = "TRIM: Harness-1 / Harness-G / BC+ train and eval line (successor of SCAPE run_train / run_eval)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "TRIM authors" }]
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
train = [
  "torch",
  "transformers",
  "accelerate",
]
serve = [
  "vllm",
]

[tool.setuptools.packages.find]
include = ["trim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
