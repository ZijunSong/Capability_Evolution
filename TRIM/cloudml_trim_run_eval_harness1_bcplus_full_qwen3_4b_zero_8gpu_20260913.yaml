#    + 调用 zero eval 脚本）。
# eval 脚本：TRIM/scripts/run_bcplus_full_qwen3_4b_zero_gpu8_eval.sh
#   8 个单卡 vLLM actor (TP=1) + 32 API-client workers（4 workers/GPU，充分利用 8 卡），local_bm25 无 Chroma，无 verifier。
# tiktoken：/mnt/songzijun/tiktoken-bundle.zip 解压到 /tmp/tiktoken-bundle
#   o200k_base.tiktoken（gpt-oss/harmony 离线词表；不存在独立 o200k_harmony.tiktoken）
#   cl100k_base.tiktoken（fallback）。
JobName: "trim_harness1_bcplus_full_qwen3_4b_zero_eval_8gpu_20260913"
