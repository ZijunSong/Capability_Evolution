schema_version: rsi_campaign_v2
tier: pilot
campaign_id: e0_probe
seed: 17
max_rounds: 1

# E0 measurement rebuild (audit doc §15): 4 independent AppWorld scenarios,
# 1 task each.  Phases per task:
#   A. no-op        — scripted Finish immediately; measures initial-state
#                     partial (calibration number).
#   B. known-correct — only when the bundle ships a real compiled_solution.py
#                     (currently canary-only: phase auto-skips with BLOCKED).
#   C. 9B real H0   — Qwen3.5-9B minimal harness, real model calls; the point
#                     is VALID measurements: model_calls>0, tokens>0, legal
#                     actions, strict vs partial separated, per-phase artifact
#                     digests.
# Gate: any phase scoring INVALID or scorer-digest mutation FAILS E0.

policy:
  initial_artifact: null
  provider: hf_path
  model_path: /mnt/songzijun/models/Qwen3.5-9B
  trainable: false
  teacher_sync: batch_snapshot
  adapter_mode: cumulative
  cross_round_optimizer: reset

runtime:
  contract: configs/h0_contract.json
  harness: minimal
  context_policy: deterministic_window_v1
  clock: real_monotonic
  max_actions: 24
  max_tool_calls: 64
  max_extra_llm_calls: 2
  max_chars: 8000
  max_new_tokens: 512
  max_wall_ms: 600000
  temperature: 1.0
  thinking: false
  snapshot_mode: lazy_replay

suite:
  registry: configs/environments.yaml
  domains: [appworld]
  split_manifest: data/splits/e0_probe_appworld.json
  manifest_is_authoritative: true
  selection_role: e0_probe
  aggregate: equal_domain_macro
  shared_model: true
  shared_bank: true
  statistics_mode: pilot_reused_dev

evolution:
  seed_mode: empty_each_round
  proposer_mode: self
  proposer_policy: current
  algorithm: archive_code_search
  max_generations: 0
  candidates_per_generation: 0
  max_candidate_evaluations: 0
  plateau_patience: 1
  editable_scope: bank_only
  dev_panel_per_domain: 0
  frozen_thresholds: false

scoring:
  primary: appworld_strict_success
  auxiliary: [partial_test_pass_rate, declared_finish, cost]
  evaluator_mode: offline_frozen_artifact
  invalid_measurement: block

opd:
  routes: [explicit_map, native_anchor]
  max_shadow_events: 4
  max_targets_per_decision: 1
  uncertain_realizability: skip
  objective: gated_projected_gap_v1
  lambda: 0.01
  gate_beta: 5.0
  min_real_support_policy: configs/probe_policy.json

training:
  method: harness_opd_rl
  backend: hf_reference
  reward: task_outcome
  max_optimizer_steps_per_round: 2
  rollout_refresh: each_batch
  batch_episodes: 2
  budget: configs/train_budget.json
  learning_rate: 0.001

promotion:
  policy: configs/promotion_policy.json
  allow_partial_internalization: true

evaluation:
  statistics_mode: pilot_reused_dev
  final_test_access: after_campaign_freeze
  compare_cells: [old_min, old_full, new_min, new_full]
  confirm_panel_per_domain: 4

execution:
  mode: execute
  candidate_isolation: subprocess
  job_backend: local
  runs_root: runs
  panel_workers: 8
