schema_version: rsi_campaign_v1
tier: pilot
campaign_id: train_harness_opd_alfworld_9b_pilot50_32gpu
seed: 17
max_rounds: 1
policy:
  initial_artifact: null
  provider: hf_path
  model_path: /mnt/songzijun/models/Qwen3.5-9B
  trainable: true
  teacher_sync: batch_snapshot
  adapter_mode: cumulative
  cross_round_optimizer: reset
runtime:
  contract: configs/h0_contract.json
  harness: minimal
  context_policy: deterministic_window_v1
  max_actions: 48
  max_extra_llm_calls: 2
  max_chars: 8000
  max_new_tokens: 512
  temperature: 1.0
  max_wall_ms: 900000
  profile: react_zero_shot_v1
  environment_doc: configs/env_docs/alfworld_v1.md
suite:
  registry: configs/environments.yaml
  domains:
  - alfworld
  split_manifest: data/splits/e1_alfworld_v2_confirm.json
  aggregate: equal_domain_macro
  shared_model: true
  shared_bank: true
  statistics_mode: pilot_reused_dev
  selection_role: harness_select
  manifest_is_authoritative: true
  opd_role: work_train
evolution:
  seed_mode: empty_each_round
  proposer_mode: self
  algorithm: archive_code_search
  max_generations: 1
  candidates_per_generation: 1
  max_candidate_evaluations: 1
  plateau_patience: 1
  editable_scope: bank_only
  dev_panel_per_domain: 12
  frozen_thresholds: false
opd:
  routes:
  - explicit_map
  - native_anchor
  max_shadow_events: 2
  max_targets_per_decision: 1
  uncertain_realizability: skip
  objective: gated_projected_gap_v1
  lambda: 0.01
  gate_beta: 5.0
  min_real_support_policy: configs/probe_policy.json
training:
  method: harness_opd_rl
  backend: hf_reference
  reward: task_outcome
  adapter_mode: cumulative
  lora:
    rank: 32
    alpha: 64
    target_suffixes:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - out_proj
    - in_proj_qkv
  learning_rate: 0.0001
  max_optimizer_steps_per_round: 50
  checkpoint_every: 5
  rollout_refresh: each_batch
  episodes_per_rank_per_step: 2
  budget: configs/train_budget.json
  require_teacher_readiness: true
  readiness_ref: runs/alfworld_confirm_r1/teacher_readiness.json
promotion:
  policy: configs/promotion_policy.json
  allow_partial_internalization: true
evaluation:
  statistics_mode: pilot_reused_dev
  final_test_access: after_campaign_freeze
  compare_cells:
  - old_min
  - old_full
  - new_min
  - new_full
  confirm_panel_per_domain: 4
execution:
  mode: execute
  candidate_isolation: subprocess
  job_backend: local
  runs_root: runs
  panel_workers: 7
