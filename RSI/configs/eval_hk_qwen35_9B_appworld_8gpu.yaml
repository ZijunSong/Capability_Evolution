schema_version: rsi_campaign_v1
tier: pilot
campaign_id: eval_hk_appworld_qwen35_9b_bench
seed: 17
max_rounds: 1

# exp_hk 正式测评 — Qwen3.5-9B × 自进化 harness H_k（fh46b champion），完整 AppWorld
# benchmark（全部 7 个 role 池 325 task，零抽样），与 exp_h0（dhlol r2，minimal 空
# bank）逐池对比。rsi.cli eval --harness bank --bank <champion.json>；
# champion = runs/evolve_appworld_qwen35_9b_p1_r6/evolve/champion.json
# （bank_digest 73ddc436…，唯一组件 context_compressor）。
# 除 harness/bank/campaign 外与 configs/eval_h0_qwen35_9B_appworld_8gpu.yaml 逐字段
# 一致（seed=17、max_actions=24、max_new_tokens=512、temperature=1.0、split 同源
# provider 确定性切分），保证 paired 可比。
# 输出 runs/eval_hk_appworld_qwen35_9b_bench_r1/eval/，每 role 一份
# eval_<role>_bank_73ddc436_17.json。

policy:
  initial_artifact: null
  provider: hf_path
  model_path: /mnt/songzijun/models/Qwen3.5-9B
  trainable: false
  teacher_sync: batch_snapshot
  adapter_mode: cumulative
  cross_round_optimizer: reset

runtime:
  contract: configs/h0_contract.json
  harness: minimal
  context_policy: deterministic_window_v1
  max_actions: 24
  max_extra_llm_calls: 2
  max_chars: 8000
  max_new_tokens: 512
  temperature: 1.0

suite:
  registry: configs/environments.yaml
  domains: [appworld]
  split_manifest: data/splits/eval_hk_appworld_qwen35_9b.json
  aggregate: equal_domain_macro
  shared_model: true
  shared_bank: true
  statistics_mode: pilot_reused_dev
  selection_role: harness_select

evolution:
  seed_mode: empty_each_round
  proposer_mode: self
  proposer_policy: current
  proposer_max_new_tokens: 4096
  proposer_max_retries: 2
  algorithm: archive_code_search
  max_generations: 8
  candidates_per_generation: 2
  max_candidate_evaluations: 16
  plateau_patience: 3
  editable_scope: bank_only
  dev_panel_per_domain: 0
  frozen_thresholds: false

opd:
  routes: [explicit_map, native_anchor]
  max_shadow_events: 4
  max_targets_per_decision: 1
  uncertain_realizability: skip
  objective: gated_projected_gap_v1
  lambda: 0.01
  gate_beta: 5.0
  min_real_support_policy: configs/probe_policy.json

training:
  method: harness_opd_rl
  backend: hf_reference
  reward: task_outcome
  max_optimizer_steps_per_round: 2
  rollout_refresh: each_batch
  batch_episodes: 2
  budget: configs/train_budget.json
  learning_rate: 0.001

promotion:
  policy: configs/promotion_policy.json
  allow_partial_internalization: true

evaluation:
  statistics_mode: pilot_reused_dev
  final_test_access: after_campaign_freeze
  compare_cells: [old_min, old_full, new_min, new_full]
  confirm_panel_per_domain: 4

execution:
  mode: execute
  candidate_isolation: subprocess
  job_backend: local
  runs_root: runs
  panel_workers: 8
