schema_version: rsi_campaign_v1
tier: pilot
campaign_id: train_opd_qwen35_9b_teacher_all_student_zero_200step
seed: 17
max_rounds: 1

# HarnessOPD 内化试跑（all-teacher / zero-student，200-step / 32卡 4node）：
#   Student = 仅 H0（空 bank，zero）on-policy 采样
#   Teacher = H0 + champion bank（all，r4 演化的 FinishGuard）隔离 fork
#   联合更新 L = CISPO + λ·gated projected-gap，每 batch 一次 optimizer step
#   200 step，LoRA 累计 adapter（base 冻结），32 rank 数据并行（torchrun）
#   跳过 probe 准入（用户指定试跑）
# 领域为 toy_file/toy_kv 协议 panel；champion: runs/evolve_qwen35_9b_p1_r4/evolve/champion.json

policy:
  initial_artifact: null
  provider: hf_path
  model_path: /mnt/songzijun/models/Qwen3.5-9B
  trainable: true
  teacher_sync: batch_snapshot
  adapter_mode: cumulative
  cross_round_optimizer: reset

runtime:
  contract: configs/h0_contract.json
  harness: minimal
  context_policy: deterministic_window_v1
  max_actions: 6
  max_extra_llm_calls: 2
  max_chars: 4000
  max_new_tokens: 256
  temperature: 1.0            # on-policy 采样

suite:
  registry: configs/environments.yaml
  domains: [toy_file, toy_kv]
  split_manifest: data/splits/evolve_p1.json
  aggregate: equal_domain_macro
  shared_model: true
  shared_bank: true
  statistics_mode: pilot_reused_dev
  selection_role: harness_select

evolution:
  seed_mode: empty_each_round
  proposer_mode: self
  algorithm: archive_code_search
  max_generations: 1
  candidates_per_generation: 1
  max_candidate_evaluations: 1
  plateau_patience: 1
  editable_scope: bank_only
  dev_panel_per_domain: 4
  frozen_thresholds: false

opd:
  routes: [explicit_map, native_anchor]
  max_shadow_events: 2
  max_targets_per_decision: 1
  uncertain_realizability: skip
  objective: gated_projected_gap_v1
  lambda: 0.01
  gate_beta: 5.0
  min_real_support_policy: configs/probe_policy.json

training:
  method: harness_opd_rl
  backend: hf_reference
  reward: task_outcome
  adapter_mode: cumulative
  lora:
    rank: 32
    alpha: 64
    target_suffixes: [q_proj, k_proj, v_proj, o_proj, out_proj, in_proj_qkv]
  learning_rate: 0.0001
  max_optimizer_steps_per_round: 200
  checkpoint_every: 10
  rollout_refresh: each_batch
  episodes_per_rank_per_step: 2   # 32 rank × 2 = 64 episodes/step（全局）
  budget: configs/train_budget.json

promotion:
  policy: configs/promotion_policy.json
  allow_partial_internalization: true

evaluation:
  statistics_mode: pilot_reused_dev
  final_test_access: after_campaign_freeze
  compare_cells: [old_min, old_full, new_min, new_full]
  confirm_panel_per_domain: 4

execution:
  mode: execute
  candidate_isolation: subprocess
  job_backend: local
  runs_root: runs
  panel_workers: 7             # rollout workers 占 GPU0-6；训练主进程 GPU7
