schema_version: rsi_campaign_v2
tier: pilot
campaign_id: rsi_appworld_react_9b_v3
seed: 17
max_rounds: 1
policy:
  initial_artifact: null
  provider: hf_path
  model_path: /mnt/songzijun/models/Qwen3.5-9B
  trainable: false
  teacher_sync: batch_snapshot
  adapter_mode: cumulative
  cross_round_optimizer: reset
runtime:
  contract: configs/h0_contract.json
  clock: real_monotonic
  harness: minimal
  context_policy: deterministic_window_v1
  max_actions: 48
  max_tool_calls: 64
  max_extra_llm_calls: 2
  max_chars: 8000
  max_new_tokens: 512
  max_wall_ms: 900000
  temperature: 1.0
  thinking: false
  snapshot_mode: lazy_replay
  rng_streams:
  - environment
  - actor
  - auxiliary
  - proposer
  profile: react_zero_shot_v1
  environment_doc: configs/env_docs/appworld_v1.md
suite:
  registry: configs/environments.yaml
  evolution_domains:
  - appworld
  opd_domains:
  - appworld
  selection_domains:
  - appworld
  sealed_eval_domains: []
  domains:
  - appworld
  split_manifest: data/splits/appworld_v3_frozen.json
  manifest_is_authoritative: true
  evolution_role: work_train
  selection_role: harness_select
  opd_role: work_train
  aggregate: equal_domain_macro
  shared_model: true
  shared_bank: true
  statistics_mode: pilot_reused_dev
evolution:
  seed_mode: empty_each_round
  proposer_mode: self
  proposer_policy: current
  proposer_max_new_tokens: 4096
  proposer_max_retries: 2
  algorithm: archive_code_search
  max_generations: 8
  candidates_per_generation: 2
  max_unique_full_evaluations: 24
  max_candidate_evaluations: 16
  plateau_patience: 3
  editable_scope: bank_only
  dev_panel_per_domain: 0
  frozen_thresholds: false
  exact_cache: true
  ast_near_duplicate_check: true
  selection: provisional_quality_then_cost
  confirm_required_for_opd: true
scoring:
  primary: appworld_strict_success
  auxiliary:
  - partial_test_pass_rate
  - declared_finish
  - cost
  evaluator_mode: offline_frozen_artifact
  invalid_measurement: block
statistics:
  cluster: scenario
  selection_reuse: development_only
  final_test_access: after_campaign_freeze
opd:
  routes:
  - explicit_map
  - native_anchor
  max_shadow_events: 4
  max_targets_per_decision: 1
  uncertain_realizability: skip
  objective: gated_projected_gap_v1
  lambda: 0.01
  gate_beta: 5.0
  min_real_support_policy: configs/probe_policy.json
training:
  method: harness_opd_rl
  backend: hf_reference
  reward: task_outcome
  max_optimizer_steps_per_round: 2
  rollout_refresh: each_batch
  batch_episodes: 2
  budget: configs/train_budget.json
  learning_rate: 0.001
promotion:
  policy: configs/promotion_policy.json
  allow_partial_internalization: true
evaluation:
  statistics_mode: pilot_reused_dev
  final_test_access: after_campaign_freeze
  compare_cells:
  - old_min
  - old_full
  - new_min
  - new_full
  confirm_panel_per_domain: 4
execution:
  mode: execute
  candidate_isolation: subprocess
  job_backend: local
  runs_root: runs
  panel_workers: 8
