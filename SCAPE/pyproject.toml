[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scape"
version = "0.1.0"
description = "SCAPE: System-level Capability Migration on public Search Harness (Harness-1)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SCAPE authors" }]
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
train = [
  "torch",
  "transformers",
  "accelerate",
]
serve = [
  "vllm",
]

[tool.setuptools.packages.find]
include = ["scape*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
