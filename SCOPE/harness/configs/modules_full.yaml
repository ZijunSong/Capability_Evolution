retrieval:
  module_id: retrieval
  enabled: true
  required: true
  lifecycle_managed: false
  chunk_neighbors: false
  rerank: true

evidence_state:
  module_id: evidence_state
  enabled: true
  lifecycle_managed: true
  candidate_pool: true
  content_dedup: true
  evidence_graph: true
  importance_tagging: true
  subtractive_curation: true
  auto_seed: true
  review_memory: true
  render_structured_state: true
  preserve_minimal_selection: true

verification:
  module_id: verification
  enabled: true
  lifecycle_managed: true
  expose_verify_tool: true
  store_records: true
  render_records: true
  verification_aware_curation: true

context_budget:
  module_id: context_budget
  enabled: true
  lifecycle_managed: true
  sentence_compression: true
  structured_context_rendering: true
  recent_window: true
  token_budget_marker: true
  stop_budget_hint: true
  # Enabled after BrowseComp full-run analysis: 21/830 episodes OOM'd at 32k.
  deterministic_truncation: true

recovery:
  module_id: recovery
  enabled: false
  lifecycle_managed: false
